services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: bread
      POSTGRES_USER: bread
      POSTGRES_PASSWORD: bread_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bread -d bread"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - bread-postgres:/var/lib/postgresql/data

  redis:
    image: redis:8.8.1-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bread-postgres:
