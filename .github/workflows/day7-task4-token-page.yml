name: day7-task4-token-page

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task4-token-page.yml'
      - 'apps/api/src/display-metadata.ts'
      - 'apps/api/src/routes/token.ts'
      - 'packages/types/src/api.ts'
      - 'packages/types/src/index.ts'
      - 'apps/web/app/token/**'
      - 'apps/web/components/token/**'
      - 'apps/web/lib/api/**'
      - 'apps/web/app/globals.css'
      - 'apps/web/app/token-v2-closure.css'
      - 'tests/day7/token-page.test.tsx'
      - 'tests/day7/token-page-behavior.test.tsx'
      - 'tests/day7/token-v2-closure.test.ts'
      - 'tests/day7/token-metadata-gap-closure.test.ts'
      - 'docs/current-build-state.yaml'
      - 'docs/handoffs/day7-task4-token-page-handoff.md'
  push:
    branches:
      - 'agent/day7-task4-token-page'

permissions:
  contents: read

jobs:
  token-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 7 Token page consumer-contract tests
        run: pnpm exec vitest run tests/day7/token-page.test.tsx tests/day7/token-page-behavior.test.tsx tests/day7/token-v2-closure.test.ts tests/day7/token-metadata-gap-closure.test.ts
