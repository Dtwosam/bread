name: day2-vendor-math-once

on:
  push:
    branches: [checkpoint/day2-tracked-curve-state]
    paths:
      - .github/workflows/day2-vendor-math-once.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Lane 2 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: checkpoint/day2-tracked-curve-state

      - name: Fetch and verify exact frozen Pons math dependencies
        shell: bash
        run: |
          set -euo pipefail
          REF='d5491e20be56051a68abf47136f6890c3ce3ff7d'
          BASE="https://raw.githubusercontent.com/ponsdotdev/ponsfamily/${REF}/contractsV2/lib/openzeppelin-contracts/contracts"

          mkdir -p contracts/lib/openzeppelin-contracts/contracts/utils/math
          mkdir -p contracts/lib/openzeppelin-contracts/contracts/utils

          curl -fsSL "${BASE}/utils/math/Math.sol" -o contracts/lib/openzeppelin-contracts/contracts/utils/math/Math.sol
          curl -fsSL "${BASE}/utils/Panic.sol" -o contracts/lib/openzeppelin-contracts/contracts/utils/Panic.sol
          curl -fsSL "${BASE}/utils/math/SafeCast.sol" -o contracts/lib/openzeppelin-contracts/contracts/utils/math/SafeCast.sol

          check_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git hash-object "$path")"
            if [[ "$actual" != "$expected" ]]; then
              echo "blob mismatch for $path: expected $expected got $actual" >&2
              exit 1
            fi
          }

          check_blob contracts/lib/openzeppelin-contracts/contracts/utils/math/Math.sol e7288595b6539e986aef1a7a524884d86fc2d643
          check_blob contracts/lib/openzeppelin-contracts/contracts/utils/Panic.sol e168824d34b3f0ba0be33317fb34b9e74fc148b6
          check_blob contracts/lib/openzeppelin-contracts/contracts/utils/math/SafeCast.sol ccb979f61c9577e6338276cff49625d5a2191eb3

      - name: Commit verified frozen files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bread-source-freeze'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            contracts/lib/openzeppelin-contracts/contracts/utils/math/Math.sol \
            contracts/lib/openzeppelin-contracts/contracts/utils/Panic.sol \
            contracts/lib/openzeppelin-contracts/contracts/utils/math/SafeCast.sol
          if git diff --cached --quiet; then
            echo 'No vendored changes required.'
            exit 0
          fi
          git commit -m 'chore: vendor frozen OpenZeppelin math dependencies'
          git push origin HEAD:checkpoint/day2-tracked-curve-state
