name: day6-task10-static-fix

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch-static-types:
    if: github.head_ref == 'agent/day6-task10-rebuild-reconcile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/day6-task10-rebuild-reconcile
      - name: Apply exact Task 10 TypeScript narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/indexer/src/reconcile.ts')
          text = path.read_text()
          replacements = {
            ": snapshot.stack?.addresses[role] ?? input.context.addresses[role];": ": snapshot.stack?.addresses[role] ?? (input.context.addresses as Readonly<Record<string, string | undefined>>)[role];",
            "toBlockHash: loaded.toBlockHash,": "toBlockHash: loaded.toBlockHash as `0x${string}` ,",
          }
          for old, new in replacements.items():
            if text.count(old) != 1:
              raise SystemExit(f'expected one occurrence of {old!r}, got {text.count(old)}')
            text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/indexer/src/reconcile.ts
      - name: Commit exact static repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/indexer/src/reconcile.ts
          git commit -m 'fix(day6): narrow rebuild reconciliation types'
          git push origin HEAD:agent/day6-task10-rebuild-reconcile
