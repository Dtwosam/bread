name: day7-task6-create-launch

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task6-create-launch.yml'
      - 'packages/protocol-sdk/src/**'
      - 'apps/web/app/create/**'
      - 'apps/web/components/create/**'
      - 'apps/web/lib/transactions/**'
      - 'apps/web/components/trade/**'
      - 'apps/web/lib/wallet/**'
      - 'tests/day7/create-review.test.tsx'
      - 'tests/day7/launch-review.test.ts'
      - 'tests/day7/launch-execution.test.ts'
      - 'tests/day7/launch-recovery.test.ts'
      - 'docs/current-build-state.yaml'
      - 'docs/handoffs/day7-task6-create-launch-handoff.md'
  push:
    branches:
      - 'agent/day7-task6-create-launch-v2'

permissions:
  contents: read

jobs:
  create-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 7 Create and launch tests
        run: >-
          pnpm exec vitest run
          tests/day7/create-review.test.tsx
          tests/day7/launch-review.test.ts
