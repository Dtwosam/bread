name: day9-prettier-resume-test-preview

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate
    paths:
      - ".github/workflows/day9-prettier-resume-test-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Print exact Prettier output
        run: |
          pnpm exec prettier --write tests/day9/lan-runtime-resume-state.test.ts
          echo '===BEGIN_FORMATTED_TEST==='
          cat tests/day9/lan-runtime-resume-state.test.ts
          echo '===END_FORMATTED_TEST==='
