name: day7-task1-state-refresh
# Retrigger after this workflow already exists in branch history.

on:
  push:
    branches:
      - 'docs/day7-task1-durable-handoff'
    paths:
      - '.github/workflows/day7-task1-state-refresh.yml'

permissions:
  contents: write

jobs:
  refresh-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/day7-task1-durable-handoff
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - name: Advance durable build-state pointer
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/current-build-state.yaml')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once('schema_version: 1.36', 'schema_version: 1.37')
          replace_once('updated_at: 2026-08-09', 'updated_at: 2026-08-10')

          replace_once(
              '  - "Day 6 Task 11 PR #57: VALIDATION_CLOSEOUT_GUARDED_MERGE_PASS"\n',
              '  - "Day 6 Task 11 PR #57: VALIDATION_CLOSEOUT_GUARDED_MERGE_PASS"\n'
              '  - "Day 6 post-closeout PR #58: DAY6_DURABLE_CLOSEOUT_PASS"\n'
              '  - "Day 7 Task 1 PR #59 + handoff #60: PUBLIC_WEB_FOUNDATION_INTEGRATED_PASS_DURABLE"\n',
          )

          replace_once(
              'active_checkpoint: "Day 6 — post-closeout durable handoff"\n'
              'active_lane: "Task-11 validation/closeout PR #57 is merged on main at b87e698f382d2a226c2914a4ddd556b7925ed001. Post-closeout handoff PR #58 from that exact merged main must pass root CI plus retained Task-5/6/7/8/9/10 real-step workflows on one exact docs-bearing head before Day 6 becomes durably closed or Day 7 begins."\n'
              'active_gate: DAY6_POST_CLOSEOUT_HANDOFF_INTEGRATION_REQUIRED_BEFORE_DAY7',
              'active_checkpoint: "Day 7 — Public Web"\n'
              'active_lane: "Task 2 — indexed read client/query/freshness/degraded-state boundary. Task 1 is durably integrated; Explore/Search page implementation must wait for this canonical Day-6 API consumer boundary."\n'
              'active_gate: DAY7_TASK2_INDEXED_READ_BOUNDARY_RED_GREEN',
          )

          replace_once('  prior_state_schema_version: 1.35', '  prior_state_schema_version: 1.36')
          replace_once(
              '  prior_state_blob_sha: f38e50af0b1a8e0e47190fd45c0037b3269f4538',
              '  prior_state_blob_sha: 6f99be145fa57bd941726c8501db3f9d17889f57',
          )
          replace_once(
              '    v1.36 advances the durable pointer through the verified Task-11 exact-head acceptance and guarded merge while preserving prior accepted workflow identities. Day 6 is intentionally not marked durably closed until the post-closeout handoff from actual merged main passes its own exact-head gate and merges. No accepted verdict, source boundary, blocker, invariant or authority rule is revoked.',
              '    v1.37 reconciles the previously stale post-closeout pointer against actual GitHub history, records Day 6 durably closed at PR #58 merge 9c9012db9f2fe607edc6e668a2fa19d34f925e87, and advances through the exact-head-green guarded Day-7 Task-1 implementation PR #59 plus durable handoff PR #60. No accepted Day-1 through Day-6 verdict, source boundary, blocker, invariant or authority rule is revoked.',
          )

          replace_once('  id: DAY6-TASK11-MERGED-MAIN', '  id: DAY7-TASK1-PUBLIC-WEB-FOUNDATION')
          replace_once(
              '  day6_task11_merge: b87e698f382d2a226c2914a4ddd556b7925ed001\n'
              '  status: DAY6_TASK11_MERGED_POST_CLOSEOUT_HANDOFF_PENDING',
              '  day6_task11_merge: b87e698f382d2a226c2914a4ddd556b7925ed001\n'
              '  day6_post_closeout_handoff_merge: 9c9012db9f2fe607edc6e668a2fa19d34f925e87\n'
              '  day7_task1_implementation_merge: 1e5d3537f22dbdb969e50da009c641b94f35a656\n'
              '  day7_task1_handoff_pr: 60\n'
              '  status: DAY7_TASK1_PUBLIC_WEB_FOUNDATION_INTEGRATED_PASS_DURABLE',
          )

          replace_once(
              'working_branches:\n  - docs/day6-post-closeout-b87e698f',
              'working_branches: []',
          )

          replace_once(
              '  day6_post_closeout_handoff_pr: 58\n  day6_production_code_started: true',
              '  day6_post_closeout_handoff_pr: 58\n'
              '  day7_task1_pr: 59\n'
              '  day7_task1_handoff_pr: 60\n'
              '  day6_production_code_started: true\n'
              '  day7_public_web_started: true',
          )

          replace_once(
              '  task11_scope_rule: >-\n'
              '    Task 11 is validation/evidence/CI/durable closeout only. It does not redesign Day 6, add financial authority, invent production values, or authorize Day 7 before the post-closeout handoff from actual merged main is itself exact-head green and merged.',
              '  task11_scope_rule: >-\n'
              '    Task 11 is validation/evidence/CI/durable closeout only. It does not redesign Day 6, add financial authority, invent production values, or authorize Day 7 before the post-closeout handoff from actual merged main is itself exact-head green and merged.\n'
              '  day7_task1_scope_rule: >-\n'
              '    Task 1 freezes and integrates the 04B design tokens, reusable UI primitives and responsive global shell only. It does not fabricate feed/token data, implement Search/wallet/transaction behavior early, add raw-RPC primary reads, invent routes or change protocol/economic semantics.',
          )

          replace_once(
              '  post_closeout_handoff:\n'
              '    branch: docs/day6-post-closeout-b87e698f\n'
              '    pr: 58\n'
              '    path: docs/handoffs/day6-post-closeout-b87e698f.md\n'
              '    status: FINAL_EXACT_HEAD_SEVEN_WORKFLOW_CI_AND_GUARDED_MERGE_PENDING\n'
              '  status: IMPLEMENTATION_CLOSEOUT_MERGED_POST_CLOSEOUT_HANDOFF_PENDING',
              '  post_closeout_handoff:\n'
              '    branch: docs/day6-post-closeout-b87e698f\n'
              '    pr: 58\n'
              '    path: docs/handoffs/day6-post-closeout-b87e698f.md\n'
              '    head: 8e2f20bf7ed93b5dc957ae96b08ecc16329cd515\n'
              '    ci: 31340398943\n'
              '    retained_task5_ci: 31340398903\n'
              '    retained_task6_ci: 31340398935\n'
              '    retained_task7_ci: 31340398929\n'
              '    retained_task8_ci: 31340398919\n'
              '    retained_task9_ci: 31340398927\n'
              '    retained_task10_ci: 31340398913\n'
              '    merge: 9c9012db9f2fe607edc6e668a2fa19d34f925e87\n'
              '    status: INTEGRATED_PASS_DURABLE\n'
              '  status: DAY6_DURABLE_CLOSEOUT_PASS',
          )

          marker = '\nblockers:\n'
          if text.count(marker) != 1:
              raise SystemExit('blockers marker must occur exactly once')
          day7_block = '''

day7_task1:
  status: PUBLIC_WEB_FOUNDATION_INTEGRATED_PASS_DURABLE
  implementation_pr: 59
  implementation_branch: agent/day7-public-web-foundation
  baseline: 9c9012db9f2fe607edc6e668a2fa19d34f925e87
  final_head: feb5ce08c03d2e51b1813f30e94c5fbb5add3dba
  implementation_merge: 1e5d3537f22dbdb969e50da009c641b94f35a656
  handoff_pr: 60
  handoff: docs/handoffs/day7-task1-public-web-foundation-handoff.md
  plan: docs/superpowers/plans/2026-08-10-day7-public-web.md
  plan_corrections: docs/superpowers/plans/2026-08-10-day7-route-contract-correction.md
  source_design_review: PASS
  exact_head_ci:
    root: 31342250098
    day7_task1: 31342250101
    retained_task5: 31342250150
    retained_task6: 31342250124
    retained_task7: 31342250123
    retained_task8: 31342250096
    retained_task9: 31342250106
    retained_task10: 31342250120
  next_lane: DAY7_TASK2_INDEXED_READ_BOUNDARY
'''
          text = text.replace(marker, day7_block + marker, 1)

          replace_once(
              '  CURRENT_PONS_FACTORY_SOURCE_PARITY: "reference/parity-claim gap only; does not block Day-6 local/test implementation"',
              '  CURRENT_PONS_FACTORY_SOURCE_PARITY: "reference/parity-claim gap only; does not block Day-7 frontend/local/test implementation"',
          )

          verification_marker = '\nday6_handoff_contract:\n'
          if text.count(verification_marker) != 1:
              raise SystemExit('day6_handoff_contract marker must occur exactly once')
          verification_addition = '''

  day6_post_closeout_final_head: 8e2f20bf7ed93b5dc957ae96b08ecc16329cd515
  day6_post_closeout_ci: 31340398943
  day6_post_closeout_task5_ci: 31340398903
  day6_post_closeout_task6_ci: 31340398935
  day6_post_closeout_task7_ci: 31340398929
  day6_post_closeout_task8_ci: 31340398919
  day6_post_closeout_task9_ci: 31340398927
  day6_post_closeout_task10_ci: 31340398913
  day6_post_closeout_merge: 9c9012db9f2fe607edc6e668a2fa19d34f925e87
  day6_durable_closeout: PASS

  day7_task1_initial_red_ci: 31341270239
  day7_task1_touch_target_red_ci: 31341715167
  day7_task1_typography_control_red_ci: 31341935378
  day7_task1_loading_pressed_red_ci: 31342095678
  day7_task1_final_head: feb5ce08c03d2e51b1813f30e94c5fbb5add3dba
  day7_task1_final_ci: 31342250098
  day7_task1_final_dedicated_ci: 31342250101
  day7_task1_final_task5_ci: 31342250150
  day7_task1_final_task6_ci: 31342250124
  day7_task1_final_task7_ci: 31342250123
  day7_task1_final_task8_ci: 31342250096
  day7_task1_final_task9_ci: 31342250106
  day7_task1_final_task10_ci: 31342250120
  day7_task1_source_design_review: PASS
  day7_task1_merge: 1e5d3537f22dbdb969e50da009c641b94f35a656
'''
          text = text.replace(verification_marker, verification_addition + verification_marker, 1)

          replace_once(
              'next_action: >-\n'
              '  Freeze the final docs-bearing head of Day-6 post-closeout handoff PR #58. Require exact-head root CI plus retained Task-5, Task-6, Task-7, Task-8, Task-9 and Task-10 workflows with real runner steps and full PASS. Then guarded-merge PR #58 with expected-head protection, verify actual merged main, mark Day 6 durably closed from that verified merge, and begin the approved Day-7 Public Web work from that exact durable baseline.',
              'next_action: >-\n'
              '  From the freshly verified latest main after Day-7 Task-1 durable handoff PR #60, begin Task 2: indexed read client/query/freshness/degraded-state boundary. First write and prove a meaningful RED for the missing canonical browser /v1 read boundary, then implement typed IndexedResponse/FreshnessMeta propagation, typed API errors, bounded query serialization, deduplicated query keys and explicit FRESH/LAGGING/REBUILDING/DEGRADED classification without raw-RPC primary rendering. Integrate and durably hand off Task 2 before Explore/Search page implementation.',
          )
          replace_once(
              '  - "Do not mark Day 6 durably closed or begin Day 7 before post-closeout handoff PR #58 is exact-head green, guarded-merged and main is verified."',
              '  - "Do not reopen Day 6 absent a demonstrated regression, genuine source conflict or newly ratified source change."\n'
              '  - "Do not begin Explore/Search page implementation before the Task-2 indexed read boundary is integrated and durable."\n'
              '  - "Do not invent a /search or /create/review route; preserve the frozen 04A/04C route map."',
          )

          path.write_text(text)
          PY
      - run: pnpm install --frozen-lockfile
      - name: Validate repository and refreshed build state
        run: pnpm validate
      - name: Commit refreshed state and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/day7-task1-state-refresh.yml
          git add docs/current-build-state.yaml
          git commit -m "docs(day7): advance durable state through Task 1"
          git push origin HEAD:docs/day7-task1-durable-handoff
