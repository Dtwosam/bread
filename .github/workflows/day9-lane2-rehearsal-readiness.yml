name: day9-lane2-rehearsal-readiness

on:
  pull_request:
    paths:
      - '.github/workflows/day9-lane2-rehearsal-readiness.yml'
      - 'tests/day9/rehearsal-readiness.test.ts'
      - 'scripts/day9/check-rehearsal-readiness.mts'
      - 'config/networks/arc-testnet.json'
      - 'config/networks/arc-mainnet.json'
      - 'config/deployments/arc-testnet.day5.json'
      - 'config/deployments/arc-mainnet.day5.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day9-lane2-rehearsal-readiness.yml'
      - 'tests/day9/rehearsal-readiness.test.ts'
      - 'scripts/day9/check-rehearsal-readiness.mts'
      - 'config/networks/arc-testnet.json'
      - 'config/networks/arc-mainnet.json'
      - 'config/deployments/arc-testnet.day5.json'
      - 'config/deployments/arc-mainnet.day5.json'

permissions:
  contents: read

jobs:
  rehearsal-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run typed Day-9 rehearsal-readiness regression
        run: pnpm exec vitest run tests/day9/rehearsal-readiness.test.ts
      - name: Validate repository/source manifests
        run: pnpm validate
