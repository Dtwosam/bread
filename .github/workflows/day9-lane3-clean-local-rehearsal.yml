name: day9-lane3-clean-local-rehearsal

on:
  pull_request:
    paths:
      - '.github/workflows/day9-lane3-clean-local-rehearsal.yml'
      - 'tests/day9/clean-local-rehearsal.test.ts'
      - 'scripts/day9/run-clean-local-rehearsal.mjs'
      - 'contracts/script/rehearsal/**'
      - 'contracts/src/rehearsal/**'
      - 'contracts/script/DeployDay5Graduation.s.sol'
      - 'contracts/script/SmokeDay5Graduation.s.sol'
      - 'contracts/src/**'
      - 'scripts/day5/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day9-lane3-clean-local-rehearsal.yml'
      - 'tests/day9/clean-local-rehearsal.test.ts'
      - 'scripts/day9/run-clean-local-rehearsal.mjs'
      - 'contracts/script/rehearsal/**'
      - 'contracts/src/rehearsal/**'
      - 'contracts/script/DeployDay5Graduation.s.sol'
      - 'contracts/script/SmokeDay5Graduation.s.sol'
      - 'contracts/src/**'
      - 'scripts/day5/**'

permissions:
  contents: read

jobs:
  clean-local-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e
        with:
          version: v1.5.0
      - run: pnpm install --frozen-lockfile
      - name: Run clean controlled deployment rehearsal
        env:
          BREAD_DAY9_MODE: CONTROLLED_FIXTURE
        run: pnpm exec vitest run tests/day9/clean-local-rehearsal.test.ts
      - name: Run full contract regression
        working-directory: contracts
        run: forge test -q
