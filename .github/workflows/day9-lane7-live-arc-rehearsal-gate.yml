name: day9-lane7-live-arc-rehearsal-gate

on:
  pull_request:
    paths:
      - '.github/workflows/day9-lane7-live-arc-rehearsal-gate.yml'
      - 'tests/day9/live-arc-rehearsal-gate.test.ts'
      - 'scripts/day9/check-live-arc-rehearsal.mts'
      - 'scripts/day9/check-rehearsal-readiness.mts'
      - 'config/networks/arc-testnet.json'
      - 'config/deployments/arc-testnet.day5.json'
      - 'docs/evidence/day9-live-arc-rehearsal.md'
      - 'docs/evidence/day9-public-arc-lifecycle-smoke.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day9-lane7-live-arc-rehearsal-gate.yml'
      - 'tests/day9/live-arc-rehearsal-gate.test.ts'
      - 'scripts/day9/check-live-arc-rehearsal.mts'
      - 'scripts/day9/check-rehearsal-readiness.mts'
      - 'config/networks/arc-testnet.json'
      - 'config/deployments/arc-testnet.day5.json'
      - 'docs/evidence/day9-live-arc-rehearsal.md'
      - 'docs/evidence/day9-public-arc-lifecycle-smoke.md'

permissions:
  contents: read

jobs:
  live-arc-rehearsal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run verified live Arc rehearsal gate regression
        run: pnpm exec vitest run tests/day9/live-arc-rehearsal-gate.test.ts
      - name: Confirm canonical Arc Testnet repository state is authorized read-only
        run: |
          set -euo pipefail
          output="$(pnpm exec tsx scripts/day9/check-live-arc-rehearsal.mts)"
          printf '%s\n' "$output"
          grep -Fq '"authorized": true' <<<"$output"
          grep -Fq '"blockers": []' <<<"$output"
      - name: Validate retained verified deployment and lifecycle evidence
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('config/deployments/arc-testnet.day5.json', 'utf8'));
          if (manifest.status !== 'VERIFIED' || manifest.chainId !== 5042002) throw new Error('canonical Arc Testnet deployment is not VERIFIED');
          if (manifest.core.factory !== '0xddf400f7a376fb8a962eee6d74c1ba37efa644f7') throw new Error('unexpected canonical Bread factory');
          if (manifest.authorities.protocolAdmin !== '0x9004e285521d69197cd9965c301b02161eb1d0d8') throw new Error('unexpected Protocol Admin Safe');
          NODE
          grep -Fq 'BREAD_ARC_TESTNET_SMOKE_RECOVERY_AND_FINAL_VERIFY_PASS' docs/evidence/day9-public-arc-lifecycle-smoke.md
      - name: Validate repository/source manifests
        run: pnpm validate
