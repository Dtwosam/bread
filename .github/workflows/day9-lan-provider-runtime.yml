name: day9-lan-provider-runtime

on:
  pull_request:
    paths:
      - ".github/workflows/day9-lan-provider-runtime.yml"
      - "apps/indexer/src/lan/chain-client.ts"
      - "apps/indexer/src/lan/chain-client.d.ts"
      - "apps/indexer/src/lan/indexer-runner.ts"
      - "tests/day9/lan-runtime-provider-boundaries.test.ts"
      - "scripts/day9/lan/**"
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate
    paths:
      - ".github/workflows/day9-lan-provider-runtime.yml"
      - "apps/indexer/src/lan/chain-client.ts"
      - "apps/indexer/src/lan/chain-client.d.ts"
      - "apps/indexer/src/lan/indexer-runner.ts"
      - "tests/day9/lan-runtime-provider-boundaries.test.ts"
      - "scripts/day9/lan/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 9 LAN provider/runtime regressions
        run: pnpm exec vitest run tests/day9/lan-runtime-provider-boundaries.test.ts
      - name: Check focused files are formatted
        run: >-
          pnpm exec prettier --check
          .github/workflows/day9-lan-provider-runtime.yml
          apps/indexer/src/lan/chain-client.ts
          tests/day9/lan-runtime-provider-boundaries.test.ts
