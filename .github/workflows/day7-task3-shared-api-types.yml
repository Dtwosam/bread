name: day7-task3-shared-api-types

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task3-shared-api-types.yml'
      - 'packages/types/**'
      - 'apps/web/components/explore/model.ts'
      - 'apps/web/components/search-surface.tsx'
      - 'tests/day7/explore-shared-types.test.ts'
  push:
    branches:
      - 'agent/day7-task3-explore-search'

permissions:
  contents: read

jobs:
  shared-api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run shared Explore API DTO continuity test
        run: pnpm exec vitest run tests/day7/explore-shared-types.test.ts
