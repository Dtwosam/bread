name: day9-prettier-diagnostic

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate
    paths:
      - ".github/workflows/day9-prettier-diagnostic.yml"

permissions:
  contents: write

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format TypeScript focused files
        run: >-
          pnpm exec prettier --write
          apps/indexer/src/lan/chain-client.ts
          tests/day9/lan-runtime-provider-boundaries.test.ts
      - name: Commit exact TypeScript formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/indexer/src/lan/chain-client.ts \
            tests/day9/lan-runtime-provider-boundaries.test.ts
          if git diff --cached --quiet; then
            echo "No TypeScript formatting changes required."
            exit 0
          fi
          git commit -m "style(day9): format LAN provider runtime TypeScript"
          git push origin HEAD:day9/synthra-arc-testnet-v3-candidate
