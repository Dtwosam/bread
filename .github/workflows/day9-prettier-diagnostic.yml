name: day9-prettier-diagnostic

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate
    paths:
      - '.github/workflows/day9-prettier-diagnostic.yml'

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format exact focused files
        run: >-
          pnpm exec prettier --write
          .github/workflows/day9-lan-provider-runtime.yml
          apps/indexer/src/lan/chain-client.ts
          tests/day9/lan-runtime-provider-boundaries.test.ts
      - name: Print formatted files
        run: |
          echo '===BEGIN_WORKFLOW==='
          cat .github/workflows/day9-lan-provider-runtime.yml
          echo '===END_WORKFLOW==='
          echo '===BEGIN_CHAIN_CLIENT==='
          cat apps/indexer/src/lan/chain-client.ts
          echo '===END_CHAIN_CLIENT==='
          echo '===BEGIN_TEST==='
          cat tests/day9/lan-runtime-provider-boundaries.test.ts
          echo '===END_TEST==='
