name: day8-lane5-hot-launch-capacity

on:
  pull_request:
    paths:
      - '.github/workflows/day8-lane5-hot-launch-capacity.yml'
      - 'scripts/load/day8-hot-launch.mts'
      - 'scripts/load/day8-hot-launch-server.mts'
      - 'scripts/load/day8-edge-cache.mts'
      - 'tests/day8/api-edge-cache-policy.test.ts'
      - 'tests/day8/rpc-failover-under-load.test.ts'
      - 'apps/api/src/**'
      - 'apps/indexer/src/fanout.ts'
      - 'apps/indexer/src/rpc-failover.ts'
      - 'packages/db/src/**'
      - 'packages/protocol-sdk/src/**'
      - 'infra/docker/compose.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day8-lane5-hot-launch-capacity.yml'
      - 'scripts/load/day8-hot-launch.mts'
      - 'scripts/load/day8-hot-launch-server.mts'
      - 'scripts/load/day8-edge-cache.mts'
      - 'tests/day8/api-edge-cache-policy.test.ts'
      - 'tests/day8/rpc-failover-under-load.test.ts'
      - 'apps/api/src/**'
      - 'apps/indexer/src/fanout.ts'
      - 'apps/indexer/src/rpc-failover.ts'
      - 'packages/db/src/**'
      - 'packages/protocol-sdk/src/**'
      - 'infra/docker/compose.yaml'

permissions:
  contents: read

jobs:
  hot-launch-10k:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run permanent API edge-cache safety regression
        run: pnpm exec vitest run tests/day8/api-edge-cache-policy.test.ts
      - name: Run bounded RPC failover under-load regression
        run: pnpm exec vitest run tests/day8/rpc-failover-under-load.test.ts
      - name: Start exact Bread development infrastructure
        run: docker compose -f infra/docker/compose.yaml up -d --wait --wait-timeout 60
      - name: Verify PostgreSQL, Redis and runner capacity envelope
        run: |
          docker compose -f infra/docker/compose.yaml exec -T postgres pg_isready -U bread -d bread
          test "$(docker compose -f infra/docker/compose.yaml exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
          echo "open_file_limit=$(ulimit -n)"
          echo "logical_cpus=$(nproc)"
      - name: Start four stateless Bread API workers
        env:
          BREAD_DATABASE_URL: postgresql://bread:bread_local_only@127.0.0.1:5432/bread
          BREAD_REDIS_URL: redis://127.0.0.1:6379
          BREAD_DAY8_SCHEMA: day8_load_cluster
        run: |
          rm -f /tmp/day8-load-server-*.log /tmp/day8-load-server-*.pid /tmp/bread-day8-head-reads-*

          BREAD_DAY8_SERVER_PORT=3108 \
          BREAD_DAY8_SEED_OWNER=1 \
          BREAD_DAY8_HEAD_READS_FILE=/tmp/bread-day8-head-reads-3108 \
          pnpm exec tsx scripts/load/day8-hot-launch-server.mts >/tmp/day8-load-server-3108.log 2>&1 &
          echo "$!" >/tmp/day8-load-server-3108.pid

          for _ in $(seq 1 60); do
            if grep -q 'DAY8_LOAD_SERVER_READY' /tmp/day8-load-server-3108.log; then break; fi
            if ! kill -0 "$(cat /tmp/day8-load-server-3108.pid)" 2>/dev/null; then
              cat /tmp/day8-load-server-3108.log
              exit 1
            fi
            sleep 1
          done
          grep -q 'DAY8_LOAD_SERVER_READY' /tmp/day8-load-server-3108.log || { cat /tmp/day8-load-server-3108.log; exit 1; }

          for port in 3109 3110 3111; do
            BREAD_DAY8_SERVER_PORT="$port" \
            BREAD_DAY8_SEED_OWNER=0 \
            BREAD_DAY8_HEAD_READS_FILE="/tmp/bread-day8-head-reads-$port" \
            pnpm exec tsx scripts/load/day8-hot-launch-server.mts >"/tmp/day8-load-server-$port.log" 2>&1 &
            echo "$!" >"/tmp/day8-load-server-$port.pid"
          done

          for port in 3109 3110 3111; do
            for _ in $(seq 1 60); do
              if grep -q 'DAY8_LOAD_SERVER_READY' "/tmp/day8-load-server-$port.log"; then break; fi
              if ! kill -0 "$(cat /tmp/day8-load-server-$port.pid)" 2>/dev/null; then
                cat "/tmp/day8-load-server-$port.log"
                exit 1
              fi
              sleep 1
            done
            grep -q 'DAY8_LOAD_SERVER_READY' "/tmp/day8-load-server-$port.log" || { cat "/tmp/day8-load-server-$port.log; exit 1; }
          done

          cat /tmp/day8-load-server-3108.log
          cat /tmp/day8-load-server-3109.log
          cat /tmp/day8-load-server-3110.log
          cat /tmp/day8-load-server-3111.log
      - name: Verify source-defined edge cache eligibility and safety policy
        run: |
          hot_token='0x000000000000000000000000000000000000000a'
          curl -sS -D /tmp/token-headers -o /dev/null "http://127.0.0.1:3108/v1/tokens/$hot_token"
          curl -sS -D /tmp/feed-headers -o /dev/null 'http://127.0.0.1:3108/v1/feed?view=new&limit=1'
          curl -sS -D /tmp/status-headers -o /dev/null 'http://127.0.0.1:3108/v1/status'
          cat /tmp/token-headers
          cat /tmp/feed-headers
          cat /tmp/status-headers
          tr -d '\r' </tmp/token-headers | grep -Fqi 'cache-control: public, max-age=0, s-maxage=1, must-revalidate'
          tr -d '\r' </tmp/feed-headers | grep -Fqi 'cache-control: public, max-age=0, s-maxage=1, must-revalidate'
          tr -d '\r' </tmp/status-headers | grep -Fqi 'cache-control: no-store'
      - name: Start four cache-policy-driven edge workers
        env:
          BREAD_DAY8_UPSTREAM_ORIGINS: http://127.0.0.1:3108,http://127.0.0.1:3109,http://127.0.0.1:3110,http://127.0.0.1:3111
        run: |
          rm -f /tmp/day8-edge-*.log /tmp/day8-edge-*.pid
          for port in 3120 3121 3122 3123; do
            BREAD_DAY8_EDGE_PORT="$port" \
            pnpm exec tsx scripts/load/day8-edge-cache.mts >"/tmp/day8-edge-$port.log" 2>&1 &
            echo "$!" >"/tmp/day8-edge-$port.pid"
          done
          for port in 3120 3121 3122 3123; do
            for _ in $(seq 1 60); do
              if grep -q 'DAY8_EDGE_READY' "/tmp/day8-edge-$port.log"; then break; fi
              if ! kill -0 "$(cat /tmp/day8-edge-$port.pid)" 2>/dev/null; then
                cat "/tmp/day8-edge-$port.log"
                exit 1
              fi
              sleep 1
            done
            grep -q 'DAY8_EDGE_READY' "/tmp/day8-edge-$port.log" || { cat "/tmp/day8-edge-$port.log"; exit 1; }
            cat "/tmp/day8-edge-$port.log"
          done
      - name: Verify edge never reuses no-store operational status
        run: |
          curl -sS -D /tmp/edge-status-1 -o /dev/null 'http://127.0.0.1:3120/v1/status'
          curl -sS -D /tmp/edge-status-2 -o /dev/null 'http://127.0.0.1:3120/v1/status'
          cat /tmp/edge-status-1
          cat /tmp/edge-status-2
          tr -d '\r' </tmp/edge-status-1 | grep -Fqi 'cache-control: no-store'
          tr -d '\r' </tmp/edge-status-2 | grep -Fqi 'cache-control: no-store'
          tr -d '\r' </tmp/edge-status-1 | grep -Fqi 'x-bread-edge-cache: MISS'
          tr -d '\r' </tmp/edge-status-2 | grep -Fqi 'x-bread-edge-cache: MISS'
      - name: Run integrated 10k edge-absorbed hot-launch capacity proof
        env:
          BREAD_DAY8_ORIGINS: http://127.0.0.1:3120,http://127.0.0.1:3121,http://127.0.0.1:3122,http://127.0.0.1:3123
          BREAD_DAY8_HEAD_READS_FILES: /tmp/bread-day8-head-reads-3108,/tmp/bread-day8-head-reads-3109,/tmp/bread-day8-head-reads-3110,/tmp/bread-day8-head-reads-3111
          BREAD_DAY8_EDGE_MODE: '1'
          BREAD_DAY8_TOKEN_CONCURRENCY: '10000'
          BREAD_DAY8_TOKEN_REQUESTS: '10000'
          BREAD_DAY8_TOKEN_ARRIVAL_WINDOW_MS: '2000'
          BREAD_DAY8_FEED_CONCURRENCY: '1000'
          BREAD_DAY8_FEED_REQUESTS: '5000'
          BREAD_DAY8_FEED_ARRIVAL_WINDOW_MS: '2000'
          BREAD_DAY8_CONNECT_CONCURRENCY: '500'
        run: pnpm exec tsx scripts/load/day8-hot-launch.mts
      - name: Stop edge workers
        if: always()
        run: |
          for port in 3123 3122 3121 3120; do
            if test -f "/tmp/day8-edge-$port.pid"; then
              pid="$(cat /tmp/day8-edge-$port.pid)"
              if kill -0 "$pid" 2>/dev/null; then
                kill -TERM "$pid"
                for _ in $(seq 1 30); do
                  if ! kill -0 "$pid" 2>/dev/null; then break; fi
                  sleep 1
                done
              fi
            fi
            cat "/tmp/day8-edge-$port.log" 2>/dev/null || true
          done
      - name: Stop stateless capacity workers
        if: always()
        run: |
          for port in 3111 3110 3109 3108; do
            if test -f "/tmp/day8-load-server-$port.pid"; then
              pid="$(cat /tmp/day8-load-server-$port.pid)"
              if kill -0 "$pid" 2>/dev/null; then
                kill -TERM "$pid"
                for _ in $(seq 1 30); do
                  if ! kill -0 "$pid" 2>/dev/null; then break; fi
                  sleep 1
                done
              fi
            fi
            cat "/tmp/day8-load-server-$port.log" 2>/dev/null || true
          done
      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
