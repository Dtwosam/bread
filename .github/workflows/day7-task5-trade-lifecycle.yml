name: day7-task5-trade-lifecycle

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task5-trade-lifecycle.yml'
      - 'contracts/src/core/BreadLaunchToken.sol'
      - 'packages/protocol-sdk/src/**'
      - 'apps/web/lib/transactions/**'
      - 'apps/web/components/trade/**'
      - 'apps/web/components/transaction-status.tsx'
      - 'apps/web/components/token/token-client.tsx'
      - 'apps/web/app/globals.css'
      - 'tests/day7/transaction-state.test.ts'
      - 'tests/day7/trade-surface.test.tsx'
      - 'tests/day7/trade-controller.test.ts'
      - 'tests/day7/trade-execution.test.ts'
      - 'tests/day7/trade-review-guard.test.ts'
      - 'tests/day7/trade-ui.test.tsx'
      - 'tests/day7/token-decimals.test.ts'
      - 'tests/day7/transaction-recovery.test.ts'
      - 'docs/current-build-state.yaml'
      - 'docs/handoffs/day7-task5-trade-lifecycle-handoff.md'
  push:
    branches:
      - 'agent/day7-task5-trade-lifecycle'

permissions:
  contents: read

jobs:
  trade-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 7 trade lifecycle tests
        run: >-
          pnpm exec vitest run
          tests/day7/transaction-state.test.ts
          tests/day7/trade-surface.test.tsx
          tests/day7/trade-controller.test.ts
          tests/day7/trade-execution.test.ts
          tests/day7/trade-review-guard.test.ts
          tests/day7/trade-ui.test.tsx
          tests/day7/token-decimals.test.ts
          tests/day7/transaction-recovery.test.ts
