name: day9-closeout-format-once

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate

permissions:
  contents: write

jobs:
  format-and-remove-helper:
    if: github.event.head_commit.message == 'ci(day9): run one-shot closeout formatter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format the repaired validator and remove this helper
        run: |
          set -euo pipefail
          pnpm exec prettier --write scripts/validation/validate-day6-read-stack.mjs
          git rm .github/workflows/day9-closeout-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validation/validate-day6-read-stack.mjs
          git diff --cached --check
          git commit -m "style(day9): format closeout validator and remove helper"
          git pull --rebase origin day9/synthra-arc-testnet-v3-candidate
          git push origin HEAD:day9/synthra-arc-testnet-v3-candidate
