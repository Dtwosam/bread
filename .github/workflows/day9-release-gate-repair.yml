name: day9-release-gate-repair

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate

permissions:
  contents: write

jobs:
  repair-stale-gates:
    if: github.event.head_commit.message != 'test(day9): align release gates with canonical current behavior'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Repair stale release assertions only
        run: |
          python - <<'PY'
          from pathlib import Path

          validator = Path('scripts/validation/validate-day6-read-stack.mjs')
          text = validator.read_text()
          old = '  "source: \'bread-indexer\';",\n'
          if old not in text:
              raise SystemExit('Day-6 freshness source validator anchor missing')
          text = text.replace(old, '', 1)
          anchor = '  requireText(apiTypes, token, "FreshnessMeta");\n}\n\nconst migration = await readRequired('
          insert = '''  requireText(apiTypes, token, "FreshnessMeta");\n}\nrequirePattern(\n  apiTypes,\n  /source:\\s*["']bread-indexer["'];/,\n  "FreshnessMeta source",\n);\n\nconst migration = await readRequired('''
          if anchor not in text:
              raise SystemExit('Day-6 freshness validator insertion anchor missing')
          validator.write_text(text.replace(anchor, insert, 1))

          trade_test = Path('tests/day7/trade-ui.test.tsx')
          text = trade_test.read_text()
          old = "    expect(experience).toContain('prepareTradeReview');"
          new = "    expect(experience).toContain('readCanonicalTradeReview');"
          if old not in text:
              raise SystemExit('Day-7 trade review assertion anchor missing')
          trade_test.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/day9-v3-final-regression.yml')
          text = workflow.read_text()
          old = "          grep -Fq '| Android Chrome physical | EXTERNAL_EXECUTION_REQUIRED |' docs/evidence/day9-browser-device-wallet-matrix.md"
          new = "          grep -Fq '| Android Chrome physical | PARTIAL_PASS_EXTERNAL_USER_EXECUTION |' docs/evidence/day9-browser-device-wallet-matrix.md\n          grep -Fq 'remaining full physical representative Android Chrome checklist' docs/evidence/day9-browser-device-wallet-matrix.md"
          if old not in text:
              raise SystemExit('Day-9 Android truthfulness assertion anchor missing')
          workflow.write_text(text.replace(old, new, 1))
          PY
      - name: Commit gate-only corrections
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/validation/validate-day6-read-stack.mjs \
            tests/day7/trade-ui.test.tsx \
            .github/workflows/day9-v3-final-regression.yml
          git diff --cached --check
          git commit -m "test(day9): align release gates with canonical current behavior"
          git push origin HEAD:day9/synthra-arc-testnet-v3-candidate
