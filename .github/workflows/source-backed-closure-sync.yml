name: source-backed-closure-sync

on:
  push:
    branches:
      - agent/ui-ux-v2-2-implementation
    paths:
      - '.github/workflows/source-backed-closure-sync.yml'
      - 'scripts/maintenance/apply-source-backed-closure.mjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/ui-ux-v2-2-implementation
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - name: Apply bounded source-backed patches
        run: node scripts/maintenance/apply-source-backed-closure.mjs
      - name: Synchronize lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Persist closure patch and remove temporary sync harness
        run: |
          git config user.name "bread-closure-bot"
          git config user.email "bread-closure-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: close automatic graduation and authoritative UI wiring"
          git push origin HEAD:agent/ui-ux-v2-2-implementation
