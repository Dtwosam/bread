name: day9-v3-scanner-format

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format-scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format bounded scanner files
        run: >-
          pnpm exec prettier --write
          apps/indexer/src/index.ts
          apps/indexer/src/reconciliation-scanner.ts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- apps/indexer/src/index.ts apps/indexer/src/reconciliation-scanner.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/indexer/src/index.ts apps/indexer/src/reconciliation-scanner.ts
          git commit -m "style(day9): format REC-06 scanner surface"
          git push origin HEAD:day9/synthra-arc-testnet-v3-candidate
