name: day8-lane3-frontend-security

on:
  pull_request:
    paths:
      - '.github/workflows/day8-lane3-frontend-security.yml'
      - 'apps/web/**'
      - 'tests/day8/frontend-security-attacks.test.tsx'
      - 'tests/day7/production-gates.test.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day8-lane3-frontend-security.yml'
      - 'apps/web/**'
      - 'tests/day8/frontend-security-attacks.test.tsx'
      - 'tests/day7/production-gates.test.ts'

permissions:
  contents: read

jobs:
  hostile-metadata-and-release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run retained Task-9 and Day-8 hostile metadata security tests
        run: >-
          pnpm exec vitest run
          tests/day7/production-gates.test.ts
          tests/day8/frontend-security-attacks.test.tsx
      - name: Build production web with the accepted CSP boundary
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/day8-frontend-security-build.log"
          pnpm --filter @bread/web build 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 80 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Bread web production build failure::$message"
            exit "$status"
          fi
      - name: Verify build leaves tracked workspace clean
        run: git diff --exit-code
