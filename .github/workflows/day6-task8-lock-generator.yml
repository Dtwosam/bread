name: day6-task8-lock-generator

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate-redis-lock-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Generate exact Task 8 Redis dependency diff
        run: |
          pnpm --filter @bread/api add --save-exact redis@6.1.0
          pnpm --filter @bread/indexer add --save-exact redis@6.1.0
          git diff -- apps/api/package.json apps/indexer/package.json pnpm-lock.yaml
