name: day9-lane5-recovery-drills

on:
  pull_request:
    paths:
      - '.github/workflows/day9-lane5-recovery-drills.yml'
      - 'tests/day9/recovery-drill-bundle.test.ts'
      - 'scripts/day9/run-recovery-drills.mts'
      - 'scripts/day9/rehearse-service-rollback.mts'
      - 'contracts/test/BreadEmergencyController.t.sol'
      - 'contracts/test/BreadGraduationRetry.t.sol'
      - 'tests/day6/rebuild-reconcile.test.ts'
      - 'tests/day8/rpc-failover-under-load.test.ts'
      - 'apps/web/e2e/specs/transaction-recovery.spec.ts'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day9-lane5-recovery-drills.yml'
      - 'tests/day9/recovery-drill-bundle.test.ts'
      - 'scripts/day9/run-recovery-drills.mts'
      - 'scripts/day9/rehearse-service-rollback.mts'

permissions:
  contents: read

jobs:
  recovery-drill-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run recovery drill mapping RED/GREEN regression
        run: pnpm exec vitest run tests/day9/recovery-drill-bundle.test.ts --testTimeout=600000
