name: day9-lane5-recovery-drills

on:
  pull_request:
    paths:
      - '.github/workflows/day9-lane5-recovery-drills.yml'
      - 'tests/day9/recovery-drill-bundle.test.ts'
      - 'scripts/day9/run-recovery-drills.mts'
      - 'scripts/day9/rehearse-service-rollback.mts'
      - 'contracts/test/BreadEmergencyController.t.sol'
      - 'contracts/test/BreadGraduationRetry.t.sol'
      - 'tests/day6/rebuild-reconcile.test.ts'
      - 'tests/day8/rpc-failover-under-load.test.ts'
      - 'apps/web/e2e/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day9-lane5-recovery-drills.yml'
      - 'tests/day9/recovery-drill-bundle.test.ts'
      - 'scripts/day9/run-recovery-drills.mts'
      - 'scripts/day9/rehearse-service-rollback.mts'
      - 'contracts/test/BreadEmergencyController.t.sol'
      - 'contracts/test/BreadGraduationRetry.t.sol'
      - 'tests/day6/rebuild-reconcile.test.ts'
      - 'tests/day8/rpc-failover-under-load.test.ts'
      - 'apps/web/e2e/**'

permissions:
  contents: read

jobs:
  recovery-drill-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e
        with:
          version: v1.5.0
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium runtime for retained transaction-recovery evidence
        run: pnpm --filter @bread/web exec playwright install --with-deps chromium
      - name: Start exact Bread development infrastructure with bounded registry retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker compose -f infra/docker/compose.yaml pull \
              && docker compose -f infra/docker/compose.yaml up -d --wait --wait-timeout 60; then
              exit 0
            fi
            docker compose -f infra/docker/compose.yaml down -v || true
            if [ "$attempt" -eq 3 ]; then
              echo "Bread infrastructure failed after 3 bounded attempts" >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done
      - name: Verify PostgreSQL and Redis
        run: |
          docker compose -f infra/docker/compose.yaml exec -T postgres pg_isready -U bread -d bread
          test "$(docker compose -f infra/docker/compose.yaml exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
      - name: Run executable recovery drill bundle
        env:
          BREAD_DB_INTEGRATION: "1"
          BREAD_DATABASE_URL: postgresql://bread:bread_local_only@127.0.0.1:5432/bread
        run: pnpm exec vitest run tests/day9/recovery-drill-bundle.test.ts --testTimeout=1200000
      - name: Verify browser fixture restored canonical manifests
        if: always()
        run: git diff --exit-code -- config/deployments/arc-testnet.day5.json config/networks/arc-testnet.json
      - name: Run root build after recovery drills
        run: pnpm build
      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
