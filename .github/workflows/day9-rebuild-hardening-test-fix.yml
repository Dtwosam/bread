name: day9-rebuild-hardening-test-fix

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate

permissions:
  contents: write

jobs:
  fix-hardening-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Correct market candle column in test digest
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/day9/graduated-v3-rebuild-hardening-db.test.ts')
          text = path.read_text()
          old = 'ORDER BY interval, bucket_start'
          new = 'ORDER BY interval_seconds, bucket_start'
          if old not in text:
              raise SystemExit('expected hardening-test typo not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit test-only correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/day9/graduated-v3-rebuild-hardening-db.test.ts
          git commit -m "test(day9): fix rebuild hardening candle digest column"
          git push origin HEAD:day9/synthra-arc-testnet-v3-candidate
