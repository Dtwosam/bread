name: day9-v3-indexing-red

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-cache-format-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: day9/synthra-arc-testnet-v3-candidate
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format bounded API cache consumer files
        run: >-
          pnpm exec prettier --write
          apps/api/src/routes/feed.ts
          apps/api/src/cache.ts
          apps/api/src/server.ts
          tests/day9/v3-cache-api-consumers.test.ts
      - name: Verify formatted files
        run: >-
          pnpm exec prettier --check
          apps/api/src/routes/feed.ts
          apps/api/src/cache.ts
          apps/api/src/server.ts
          tests/day9/v3-cache-api-consumers.test.ts
      - name: Run repository typecheck
        run: pnpm typecheck
      - name: Build shared types and API
        run: >-
          pnpm --filter @bread/types build &&
          pnpm --filter @bread/api build
      - name: Refuse unexpected formatter changes
        shell: bash
        run: |
          allowed='^(apps/api/src/routes/feed\.ts|apps/api/src/cache\.ts|apps/api/src/server\.ts|tests/day9/v3-cache-api-consumers\.test\.ts)$'
          unexpected=$(git diff --name-only | grep -Ev "$allowed" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected formatter changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Commit exact formatter output
        shell: bash
        run: |
          if git diff --quiet -- \
            apps/api/src/routes/feed.ts \
            apps/api/src/cache.ts \
            apps/api/src/server.ts \
            tests/day9/v3-cache-api-consumers.test.ts
          then
            echo "Formatter output already committed."
            exit 0
          fi
          git config user.name "Dtwosam"
          git config user.email "42391449+Dtwosam@users.noreply.github.com"
          git add \
            apps/api/src/routes/feed.ts \
            apps/api/src/cache.ts \
            apps/api/src/server.ts \
            tests/day9/v3-cache-api-consumers.test.ts
          git commit -m "style(day9): format API cache consumers"
          git push origin HEAD:day9/synthra-arc-testnet-v3-candidate
