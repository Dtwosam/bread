name: day9-v3-indexing-red

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reducer-format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Format reducer with repository Prettier
        run: pnpm exec prettier --write apps/indexer/src/reducers.ts
      - name: Print exact reducer formatting diff
        run: git --no-pager diff --no-color -- apps/indexer/src/reducers.ts
      - name: Verify formatted reducer
        run: pnpm exec prettier --check apps/indexer/src/reducers.ts
      - name: Typecheck formatted tree
        run: pnpm typecheck
      - name: Build affected workspaces
        run: >-
          pnpm --filter @bread/db build &&
          pnpm --filter @bread/indexer build &&
          pnpm --filter @bread/protocol-sdk build
