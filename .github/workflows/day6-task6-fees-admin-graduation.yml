name: day6-task6-fees-admin-graduation

on:
  pull_request:

permissions:
  contents: read

jobs:
  fees-admin-graduation-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Start exact Bread development infrastructure
        run: docker compose -f infra/docker/compose.yaml up -d --wait --wait-timeout 60
      - name: Verify PostgreSQL
        run: docker compose -f infra/docker/compose.yaml exec -T postgres pg_isready -U bread -d bread
      - name: Verify Redis
        run: test "$(docker compose -f infra/docker/compose.yaml exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
      - name: Run Day 6 Task 6 fees/admin/graduation proof against PostgreSQL
        env:
          BREAD_DB_INTEGRATION: "1"
          BREAD_DATABASE_URL: postgresql://bread:bread_local_only@127.0.0.1:5432/bread
        run: pnpm exec vitest run tests/day6/fees-admin-graduation.test.ts tests/day6/fees-admin-graduation-conformance.test.ts
      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
