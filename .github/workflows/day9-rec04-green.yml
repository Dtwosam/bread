name: day9-rec04-green

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate

permissions:
  contents: write

jobs:
  apply-rec04-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Apply exact REC-04 venue reconciliation patch
        run: |
          python - <<'PY'
          from pathlib import Path

          rebuild = Path('packages/db/src/repositories/rebuild.ts')
          text = rebuild.read_text()
          replacements = [
              (
                  "  tokenSupplyLocked: bigint | null;\n}>;",
                  "  tokenSupplyLocked: bigint | null;\n  graduatedVenueKind: string | null;\n  graduatedVenueAddress: string | null;\n  graduatedVenueFeeTier: number | null;\n  graduatedVenueQuoteIsToken0: boolean | null;\n}>;",
              ),
              (
                  "    tokenSupplyLocked: 0n,\n  };",
                  "    tokenSupplyLocked: 0n,\n    graduatedVenueKind: null,\n    graduatedVenueAddress: null,\n    graduatedVenueFeeTier: null,\n    graduatedVenueQuoteIsToken0: null,\n  };",
              ),
              (
                  "             s.position_id::text AS \"positionId\", s.position_locked AS \"positionLocked\",\n             s.token_supply_locked::text AS \"tokenSupplyLocked\"",
                  "             s.position_id::text AS \"positionId\", s.position_locked AS \"positionLocked\",\n             s.token_supply_locked::text AS \"tokenSupplyLocked\",\n             s.graduated_venue_kind AS \"graduatedVenueKind\",\n             s.graduated_venue_address AS \"graduatedVenueAddress\",\n             s.graduated_venue_fee_tier AS \"graduatedVenueFeeTier\",\n             s.graduated_venue_quote_is_token0 AS \"graduatedVenueQuoteIsToken0\"",
              ),
              (
                  "      positionLocked: boolean; tokenSupplyLocked: string | null;\n    }>(stateResult).map((row) => ({",
                  "      positionLocked: boolean; tokenSupplyLocked: string | null;\n      graduatedVenueKind: string | null; graduatedVenueAddress: string | null; graduatedVenueFeeTier: number | null;\n      graduatedVenueQuoteIsToken0: boolean | null;\n    }>(stateResult).map((row) => ({",
              ),
              (
                  "      tokenSupplyLocked: row.tokenSupplyLocked === null ? null : BigInt(row.tokenSupplyLocked),\n    }));",
                  "      tokenSupplyLocked: row.tokenSupplyLocked === null ? null : BigInt(row.tokenSupplyLocked),\n      graduatedVenueKind: row.graduatedVenueKind,\n      graduatedVenueAddress: row.graduatedVenueAddress,\n      graduatedVenueFeeTier: row.graduatedVenueFeeTier,\n      graduatedVenueQuoteIsToken0: row.graduatedVenueQuoteIsToken0,\n    }));",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing rebuild patch anchor: {old[:80]!r}')
              text = text.replace(old, new, 1)
          rebuild.write_text(text)

          reconcile = Path('apps/indexer/src/reconcile.ts')
          text = reconcile.read_text()
          replacements = [
              (
                  "    tokenSupplyLocked: bigint;\n  }>>;",
                  "    tokenSupplyLocked: bigint;\n    venueKind?: string | null;\n    venueAddress?: string | null;\n    venueFeeTier?: number | null;\n    quoteIsToken0?: boolean | null;\n  }>>;",
              ),
              (
                  "    const projected = states.get(launch.tokenAddress.toLowerCase());\n    graduationExpected.push({ token: launch.tokenAddress, ...authoritative });",
                  "    const projected = states.get(launch.tokenAddress.toLowerCase());\n    const projectedVenueKind = projected?.graduatedVenueKind ?? null;\n    const projectedVenueAddress = projected?.graduatedVenueAddress ?? null;\n    const projectedVenueFeeTier = projected?.graduatedVenueFeeTier ?? null;\n    const projectedQuoteIsToken0 = projected?.graduatedVenueQuoteIsToken0 ?? null;\n    const authoritativeVenueKind = authoritative.venueKind ?? null;\n    const authoritativeVenueAddress = authoritative.venueAddress ?? null;\n    const authoritativeVenueFeeTier = authoritative.venueFeeTier ?? null;\n    const authoritativeQuoteIsToken0 = authoritative.quoteIsToken0 ?? null;\n    const hasProjectedVenue = [projectedVenueKind, projectedVenueAddress, projectedVenueFeeTier, projectedQuoteIsToken0]\n      .some((value) => value !== null);\n    const hasAuthoritativeVenue = [authoritativeVenueKind, authoritativeVenueAddress, authoritativeVenueFeeTier, authoritativeQuoteIsToken0]\n      .some((value) => value !== null);\n    const projectedVenueComplete = typeof projectedVenueKind === 'string'\n      && isAddress(projectedVenueAddress)\n      && Number.isSafeInteger(projectedVenueFeeTier)\n      && (projectedVenueFeeTier ?? -1) >= 0\n      && typeof projectedQuoteIsToken0 === 'boolean';\n    const authoritativeVenueComplete = typeof authoritativeVenueKind === 'string'\n      && isAddress(authoritativeVenueAddress)\n      && Number.isSafeInteger(authoritativeVenueFeeTier)\n      && (authoritativeVenueFeeTier ?? -1) >= 0\n      && typeof authoritativeQuoteIsToken0 === 'boolean';\n    const venueMatch = !hasProjectedVenue && !hasAuthoritativeVenue\n      ? true\n      : projectedVenueComplete\n        && authoritativeVenueComplete\n        && projectedVenueKind.toLowerCase() === authoritativeVenueKind.toLowerCase()\n        && projectedVenueAddress.toLowerCase() === authoritativeVenueAddress.toLowerCase()\n        && projectedVenueFeeTier === authoritativeVenueFeeTier\n        && projectedQuoteIsToken0 === authoritativeQuoteIsToken0;\n    graduationExpected.push({ token: launch.tokenAddress, ...authoritative });",
              ),
              (
                  "      tokenSupplyLocked: projected?.tokenSupplyLocked ?? 0n,\n    });",
                  "      tokenSupplyLocked: projected?.tokenSupplyLocked ?? 0n,\n      venueKind: projectedVenueKind,\n      venueAddress: projectedVenueAddress,\n      venueFeeTier: projectedVenueFeeTier,\n      quoteIsToken0: projectedQuoteIsToken0,\n    });",
              ),
              (
                  "      (projected.tokenSupplyLocked ?? 0n) !== authoritative.tokenSupplyLocked\n    ) graduationMatch = false;",
                  "      (projected.tokenSupplyLocked ?? 0n) !== authoritative.tokenSupplyLocked ||\n      !venueMatch\n    ) graduationMatch = false;",
              ),
              (
                  "    'Coordinator/locker phase, swept amounts, pool/position identity and lock projection must match authoritative graduation state.',",
                  "    'Coordinator/locker phase, swept amounts, pool/position identity, lock projection and any verified graduated venue tuple must match authoritative graduation state.',",
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing reconcile patch anchor: {old[:80]!r}')
              text = text.replace(old, new, 1)
          reconcile.write_text(text)
          PY
      - name: Format bounded production files
        run: pnpm exec prettier --write packages/db/src/repositories/rebuild.ts apps/indexer/src/reconcile.ts
      - name: Commit bounded GREEN
        run: |
          if git diff --quiet -- packages/db/src/repositories/rebuild.ts apps/indexer/src/reconcile.ts; then
            echo "No REC-04 changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/db/src/repositories/rebuild.ts apps/indexer/src/reconcile.ts
          git commit -m "feat(day9): reconcile verified V3 venue identity"
          git push origin HEAD:day9/synthra-arc-testnet-v3-candidate
