name: day7-task1-ui-foundation

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task1-ui-foundation.yml'
      - 'packages/ui/**'
      - 'apps/web/**'
      - 'tests/day7/ui-foundation.test.ts'
      - 'docs/current-build-state.yaml'
      - 'docs/handoffs/day7-task1-public-web-foundation-handoff.md'
      - 'pnpm-lock.yaml'
      - 'package.json'
  push:
    branches:
      - 'agent/day7-public-web-foundation'

permissions:
  contents: read

jobs:
  ui-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 7 UI foundation source-conformance test
        run: pnpm exec vitest run tests/day7/ui-foundation.test.ts
