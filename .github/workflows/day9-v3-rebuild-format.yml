name: day9-v3-rebuild-format

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate

permissions:
  contents: write

jobs:
  format-v3-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Skip formatter echo commit
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%B)" = "style(day9): format V3 rebuild proof" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        if: steps.guard.outputs.skip != 'true'
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
        if: steps.guard.outputs.skip != 'true'
      - name: Format rebuild proof
        if: steps.guard.outputs.skip != 'true'
        run: pnpm exec prettier --write tests/day9/graduated-v3-rebuild-db.test.ts
      - name: Commit exact formatter output
        if: steps.guard.outputs.skip != 'true'
        run: |
          if git diff --quiet -- tests/day9/graduated-v3-rebuild-db.test.ts; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/day9/graduated-v3-rebuild-db.test.ts
          git commit -m "style(day9): format V3 rebuild proof"
          git push origin HEAD:day9/synthra-arc-testnet-v3-candidate
