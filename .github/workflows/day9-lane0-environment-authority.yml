name: day9-lane0-environment-authority

on:
  pull_request:
    paths:
      - '.github/workflows/day9-lane0-environment-authority.yml'
      - 'tests/day9/environment-authority.test.ts'
      - 'config/networks/arc-testnet.json'
      - 'config/deployments/arc-testnet.day5.json'
      - 'docs/evidence/day9-environment-authority.json'
      - 'docs/superpowers/plans/2026-08-10-day9-release-candidate-rehearsal.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day9-lane0-environment-authority.yml'
      - 'tests/day9/environment-authority.test.ts'
      - 'config/networks/arc-testnet.json'
      - 'config/deployments/arc-testnet.day5.json'
      - 'docs/evidence/day9-environment-authority.json'
      - 'docs/superpowers/plans/2026-08-10-day9-release-candidate-rehearsal.md'

permissions:
  contents: read

jobs:
  environment-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Verify Day-9 environment authority
        run: pnpm exec vitest run tests/day9/environment-authority.test.ts
      - name: Preserve canonical manifest validation
        run: pnpm validate:manifests
