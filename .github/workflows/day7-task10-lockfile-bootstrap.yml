name: day7-task10-lockfile-bootstrap

on:
  push:
    branches:
      - 'agent/day7-task10-playwright-closeout'
    paths:
      - '.github/workflows/day7-task10-lockfile-bootstrap.yml'

permissions:
  contents: read

jobs:
  generate-lockfile-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Generate exact Playwright package and lockfile diff
        run: |
          pnpm --filter @bread/web add -D @playwright/test@1.62.0 --lockfile-only
          echo '--- PLAYWRIGHT LOCKFILE PATCH START ---'
          git diff -- apps/web/package.json pnpm-lock.yaml
          echo '--- PLAYWRIGHT LOCKFILE PATCH END ---'
