name: day7-task2-indexed-read-boundary

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task2-indexed-read-boundary.yml'
      - 'apps/web/lib/api/**'
      - 'apps/web/components/providers.tsx'
      - 'apps/web/components/freshness-banner.tsx'
      - 'apps/web/app/layout.tsx'
      - 'apps/web/package.json'
      - 'packages/types/**'
      - 'tests/day7/read-client.test.ts'
      - 'tests/day7/read-provider.test.ts'
      - 'pnpm-lock.yaml'
      - 'docs/current-build-state.yaml'
      - 'docs/handoffs/day7-task2-indexed-read-boundary-handoff.md'
  push:
    branches:
      - 'agent/day7-task2-indexed-read-boundary'

permissions:
  contents: read

jobs:
  indexed-read-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 7 indexed read boundary source-conformance tests
        run: pnpm exec vitest run tests/day7/read-client.test.ts tests/day7/read-provider.test.ts
