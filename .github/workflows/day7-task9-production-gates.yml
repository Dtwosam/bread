name: day7-task9-production-gates

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task9-production-gates.yml'
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'tests/day7/**'
      - 'docs/current-build-state.yaml'
      - 'docs/handoffs/day7-task9-production-gates-handoff.md'
  push:
    branches:
      - 'agent/day7-task9-production-gates'

permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 7 Task 9 production-gate and affected regressions
        run: >-
          pnpm exec vitest run
          tests/day7/production-gates.test.ts
          tests/day7/secondary-routes-v2.test.ts
          tests/day7/ui-foundation.test.ts
          tests/day7/read-client.test.ts
          tests/day7/read-provider.test.ts
          tests/day7/token-page.test.tsx
          tests/day7/token-page-behavior.test.tsx
          tests/day7/create-review.test.tsx
          tests/day7/create-runtime.test.tsx
          tests/day7/wallet-network.test.tsx
      - name: Generate production bundle analysis and reject operator-code leakage
        working-directory: apps/web
        run: |
          pnpm exec next experimental-analyze --output
          test -d .next/diagnostics/analyze
          echo "Bundle analysis output:"
          du -sh .next/diagnostics/analyze
          find .next/diagnostics/analyze -maxdepth 2 -type f -print | sort
          if grep -R -q -E 'apps/operator|@bread/operator' .next/diagnostics/analyze; then
            echo "Operator/admin application code is present in the public web bundle analysis."
            exit 1
          fi
