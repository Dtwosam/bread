name: day9-v3-final-regression

on:
  push:
    branches:
      - day9/synthra-arc-testnet-v3-candidate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  affected-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Start exact Bread development infrastructure
        run: docker compose -f infra/docker/compose.yaml up -d --wait --wait-timeout 60
      - name: Verify PostgreSQL and Redis
        run: |
          docker compose -f infra/docker/compose.yaml exec -T postgres pg_isready -U bread -d bread
          test "$(docker compose -f infra/docker/compose.yaml exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
      - name: Run Day 6 trade, creator, holder, replay and rebuild regressions
        env:
          BREAD_DB_INTEGRATION: "1"
          BREAD_DATABASE_URL: postgresql://bread:bread_local_only@127.0.0.1:5432/bread
          BREAD_REDIS_URL: redis://127.0.0.1:6379
        run: >-
          pnpm exec vitest run
          tests/day6/trade-conformance.test.ts
          tests/day6/trade-vertical.test.ts
          tests/day6/creator-trade-count.test.ts
          tests/day6/holders-portfolio.test.ts
          tests/day6/holders-portfolio-conformance.test.ts
          tests/day6/replay-finality-cache-fanout.test.ts
          tests/day6/replay-cache-real-redis.test.ts
          tests/day6/rebuild-reconcile.test.ts
          tests/day6/rebuild-reconcile-conformance.test.ts
          tests/day6/rebuild-reconcile-pregraduation.test.ts
          tests/day6/rebuild-reconcile-cli.test.ts
          tests/day6/rebuild-safety-report.test.ts
      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v

  affected-consumers-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 7 token-page and Day 8 capacity regressions
        run: >-
          pnpm exec vitest run
          tests/day7/token-page.test.tsx
          tests/day7/token-page-behavior.test.tsx
          tests/day8/rpc-failover-under-load.test.ts
          tests/day8/indexer-catchup-under-arrival.test.ts
      - name: Run downstream Day 9 post-graduation route/review/controller regressions
        run: >-
          pnpm exec vitest run
          tests/day9/post-graduation-canonical-review.test.ts
          tests/day9/post-graduation-v3-route.test.ts
          tests/day9/post-graduation-v3-boundaries.test.ts
          tests/day9/post-graduation-v3-controller.test.ts
          tests/day9/post-graduation-v3-execution.test.ts
          tests/day9/post-graduation-v3-trading.test.ts
          tests/day9/post-graduation-v3-ui-execution.test.ts
          tests/day9/post-graduation-v3-ui-review.test.ts

  browser-v3-release-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Install pinned Chromium runtime
        run: pnpm --filter @bread/web exec playwright install --with-deps chromium
      - name: Run canonical deterministic web E2E including graduated V3 Router02 and Day 9 release matrix
        run: pnpm --filter @bread/web test:e2e
      - name: Verify E2E restored canonical Arc deployment manifest
        if: always()
        run: git diff --exit-code -- config/deployments/arc-testnet.day5.json

  root-workspace-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Check final-regression workflow formatting
        run: pnpm exec prettier --check .github/workflows/day9-v3-final-regression.yml
      - name: Validate repository and Day 6 read-stack closeout
        run: |
          node scripts/validation/validate-all.mjs
          node scripts/validation/validate-day6-read-stack.mjs
          pnpm validate
      - name: Run bootstrap and repository tests
        run: |
          node --test tests/bootstrap/*.test.mjs
          node tests/bootstrap/bootstrap-smoke.mjs
          pnpm test
      - name: Run workspace typecheck and build
        run: |
          pnpm typecheck
          pnpm build
      - name: Verify tracked workspace remains clean
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  foundry-and-day9-truthfulness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e
        with:
          version: v1.5.0
      - run: pnpm install --frozen-lockfile
      - name: Compile and test Solidity plus generated Bread ABI integrity
        working-directory: contracts
        run: |
          forge --version
          forge build
          node ../scripts/abi/check-bread-abi.mjs
          forge test --no-match-path 'test/fork/**'
      - name: Assert retained Day 9 evidence remains fail-closed rather than inventing RC completion
        run: |
          set -euo pipefail
          grep -Fq 'RC_TAG_CREATED = false' docs/evidence/day9-release-candidate-rehearsal.md
          grep -Fq 'day9_started: true' docs/current-build-state.yaml
          grep -Fq 'day9_complete: false' docs/current-build-state.yaml
          grep -Fq 'day9_rc_tag_created: false' docs/current-build-state.yaml
          grep -Fq 'day10_started: false' docs/current-build-state.yaml
          grep -Fq '| iOS Safari | EXTERNAL_EXECUTION_REQUIRED |' docs/evidence/day9-browser-device-wallet-matrix.md
          grep -Fq '| Android Chrome physical | EXTERNAL_EXECUTION_REQUIRED |' docs/evidence/day9-browser-device-wallet-matrix.md
          grep -Fq '| Desktop Edge | EXTERNAL_EXECUTION_REQUIRED |' docs/evidence/day9-browser-device-wallet-matrix.md
          if git show-ref --verify --quiet refs/tags/bread-day9-rc1; then
            echo 'bread-day9-rc1 must not exist while the physical matrix remains blocked.' >&2
            exit 1
          fi
