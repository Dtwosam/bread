name: day8-lane5-indexer-catchup

on:
  pull_request:
    paths:
      - '.github/workflows/day8-lane5-indexer-catchup.yml'
      - 'tests/day8/indexer-catchup-under-arrival.test.ts'
      - 'apps/indexer/src/catch-up.ts'
      - 'apps/indexer/src/replay.ts'
      - 'apps/indexer/src/index.ts'
      - 'packages/db/src/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/day8-lane5-indexer-catchup.yml'
      - 'tests/day8/indexer-catchup-under-arrival.test.ts'
      - 'apps/indexer/src/catch-up.ts'
      - 'apps/indexer/src/replay.ts'
      - 'apps/indexer/src/index.ts'
      - 'packages/db/src/**'

permissions:
  contents: read

jobs:
  catch-up:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic sustained-arrival catch-up regression
        run: pnpm exec vitest run tests/day8/indexer-catchup-under-arrival.test.ts
      - name: Typecheck indexer workspace
        run: pnpm --filter @bread/indexer typecheck
