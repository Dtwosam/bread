name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - run: node scripts/validation/validate-all.mjs
      - run: node --test tests/bootstrap/*.test.mjs
      - run: node tests/bootstrap/bootstrap-smoke.mjs

  dependency-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm test
      - run: pnpm test:day6
      - run: pnpm exec tsc --ignoreConfig --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck tests/day6/shared-contract.types.ts
      - name: Check Day 4 changed-file formatting
        run: >-
          pnpm exec prettier --check
          .github/workflows/ci.yml
          config/protocol/day4-launch-control-source-inventory.json
          docs/current-build-state.yaml
          docs/evidence/day4-factory-launch-buy-snipe-emergency.md
          scripts/validation/validate-all.mjs
          scripts/validation/validate-day4-launch-control-source-integrity.mjs
      - run: pnpm typecheck
      - run: pnpm build
      - name: Verify build leaves tracked workspace clean
        run: |
          status="$(git status --porcelain)"
          if [ -n "$status" ]; then
            printf '%s\n' "$status"
            exit 1
          fi

  foundry-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned Foundry
        uses: foundry-rs/foundry-toolchain@50d5a8956f2e319df19e6b57539d7e2acb9f8c1e
        with:
          version: v1.5.0
      - name: Verify Foundry version
        run: forge --version
      - name: Compile Solidity bootstrap
        working-directory: contracts
        run: forge build
      - name: Check generated Bread SDK ABIs
        working-directory: contracts
        run: node ../scripts/abi/check-bread-abi.mjs
      - name: Run Solidity bootstrap tests
        working-directory: contracts
        run: forge test

  infrastructure-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Start exact Bread development infrastructure
        run: docker compose -f infra/docker/compose.yaml up -d --wait --wait-timeout 60
      - name: Verify PostgreSQL
        run: docker compose -f infra/docker/compose.yaml exec -T postgres pg_isready -U bread -d bread
      - name: Verify Redis
        run: test "$(docker compose -f infra/docker/compose.yaml exec -T redis redis-cli ping | tr -d '\r')" = "PONG"
      - name: Run Day 6 PostgreSQL transaction-boundary, schema-contract, launch-vertical, and feed-cursor integration tests
        env:
          BREAD_DB_INTEGRATION: "1"
          BREAD_DATABASE_URL: postgresql://bread:bread_local_only@127.0.0.1:5432/bread
        run: pnpm exec vitest run tests/day6/db-schema.test.ts tests/day6/db-schema-contract.test.ts tests/day6/launch-vertical.test.ts tests/day6/feed-cursor-db.test.ts
      - name: Stop infrastructure
        if: always()
        run: docker compose -f infra/docker/compose.yaml down -v
