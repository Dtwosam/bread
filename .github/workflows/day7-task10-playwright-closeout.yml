name: day7-task10-playwright-closeout

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task10-playwright-closeout.yml'
      - 'apps/web/**'
      - 'packages/protocol-sdk/**'
      - 'packages/types/**'
      - 'tests/day7/**'
      - 'pnpm-lock.yaml'
      - 'docs/evidence/day7-public-web-closeout.md'
      - 'docs/superpowers/plans/2026-08-10-day7-task10-playwright-closeout.md'
  push:
    branches:
      - 'agent/day7-task10-playwright-closeout'

permissions:
  contents: read

jobs:
  primary-browser-journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run retained Day 7 Task 3 Explore/Search regression
        run: pnpm exec vitest run tests/day7/explore-feed-progress.test.ts tests/day7/explore-search.test.ts tests/day7/search-freshness.test.ts --passWithNoTests
      - name: Install pinned Chromium runtime
        run: pnpm --filter @bread/web exec playwright install --with-deps chromium
      - name: Run Day 7 Task 10 desktop/mobile browser journeys
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/day7-playwright-closeout.log"
          pnpm --filter @bread/web test:e2e 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message="$(tail -n 100 "$log")"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=Day 7 primary browser journey failure::$message"
            exit "$status"
          fi
      - name: Upload Lane 2 desktop visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bread-ui-lane2-desktop-shell-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/test-results/visual-reference/desktop-shell-1586x992.png
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Lane 2 mobile visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bread-ui-lane2-mobile-shell-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/web/test-results/visual-reference/mobile-shell-390x844.png
          if-no-files-found: warn
          retention-days: 7
      - name: Verify E2E fixture restored canonical manifests
        if: always()
        run: git diff --exit-code -- config/deployments/arc-testnet.day5.json config/networks/arc-testnet.json
