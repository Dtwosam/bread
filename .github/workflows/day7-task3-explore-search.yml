name: day7-task3-explore-search

on:
  pull_request:
    paths:
      - '.github/workflows/day7-task3-explore-search.yml'
      - 'apps/api/src/routes/feed.ts'
      - 'apps/api/src/routes/token.ts'
      - 'packages/db/src/repositories/read.ts'
      - 'apps/web/app/page.tsx'
      - 'apps/web/app/explore/**'
      - 'apps/web/components/token-card.tsx'
      - 'apps/web/components/search-surface.tsx'
      - 'apps/web/components/explore/**'
      - 'apps/web/lib/api/**'
      - 'apps/web/app/globals.css'
      - 'tests/day7/explore-feed-progress.test.ts'
      - 'tests/day7/explore-search.test.ts'
      - 'tests/day7/explore-search-v2-closure.test.ts'
      - 'tests/day7/search-freshness.test.ts'
      - 'docs/current-build-state.yaml'
      - 'docs/handoffs/day7-task3-explore-search-handoff.md'
  push:
    branches:
      - 'agent/day7-task3-explore-search'

permissions:
  contents: read

jobs:
  explore-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.15.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run Day 7 Explore/Search source-conformance tests
        run: pnpm exec vitest run tests/day7/explore-feed-progress.test.ts tests/day7/explore-search.test.ts tests/day7/explore-search-v2-closure.test.ts tests/day7/search-freshness.test.ts --passWithNoTests
