project_process_note:
  day8_scope_rule: >-
    Day 8 attacked the integrated system through extended fuzz/invariants, static/manual security review, RPC/API/indexer/realtime failure injection, hot-launch/bot-burst capacity tests, malicious metadata/CSP/signing-target checks, privileged-role abuse attempts and recovery verification. It added no product feature and waived no release/mainnet blocker.
  capacity_measurement_rule: >-
    06I keeps separate obligations: the 10,000-concurrent hot-launch stress gate proves convergence, healthy cached/read errors below one percent, bounded shared-service work and no viewer-linear RPC multiplication; existing 04D token/feed p95 targets remain under representative load. Day-8 evidence preserved both obligations without weakening either threshold.
  resilience_ownership_rule: >-
    Day-8 RPC failover and indexer catch-up wrap the existing LogClient/replayOverlap boundaries. Runtime callers retain provider/network selection, retryability policy, observed-head authority, durable checkpoint reads and event application. No parallel chain, accounting or deployment authority was introduced.
  day9_scope_rule: >-
    Day 9 is Release Candidate & Rehearsal, not feature development. It must start from the final verified durable Day-8 main, freeze an RC commit/tag, run clean testnet deployment using production scripts, verify code/config/ownership, smoke the lifecycle, rehearse web/API/indexer rollback, rebuild/reconcile, run multisig/Guardian drills, complete the browser/device/wallet/accessibility matrix, and generate evidence. Open release/mainnet blockers remain controlling and cannot be guessed away.

