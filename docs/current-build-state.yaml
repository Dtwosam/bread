day6_handoff_contract:
  architecture: TRANSACTIONAL_EVENT_JOURNAL_WITH_SYNCHRONOUS_PROJECTIONS
  authority: "Chain is authoritative; PostgreSQL/indexer/Redis/API are deterministic rebuildable read projections and accelerators with no financial write authority"
  journal_identity: "chainId + transactionHash + logIndex"
  transaction_rule: "journal insert + affected projections + checkpoint advancement in one PostgreSQL transaction"
  post_commit_rule: "cache invalidation and realtime fanout only after durable DB apply"
  replay_rule: "overlap replay is idempotent; checkpoint hash contradiction fails closed"
  rebuild_rule: "selected-stack rebuild starts at deploymentStartBlock, uses production applyRange, requires isolated/local target verification and cannot succeed without PASS authoritative reconciliation"
  api_rule: "all public reads are bounded, cursor/index oriented, checkpoint-freshness bearing and DB/indexer backed; raw RPC is not the primary route read source"
  required_endpoints:
    - GET /v1/feed
    - GET /v1/search
    - GET /v1/tokens/:address
    - GET /v1/tokens/:address/trades
    - GET /v1/tokens/:address/holders
    - GET /v1/portfolio/:address
    - GET /v1/creators/:address
    - GET /v1/status
  day6_acceptance:
    - DELETE_DB_REBUILD_PASS
