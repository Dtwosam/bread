  - "Do not introduce per-card/component RPC fanout or raw-RPC primary UX."
  - "Do not route user trades, launches or claims through a centralized Bread transaction server or create `/v1` financial mutation routes."
  - "Do not add server-side transaction submission, signing, relaying, queueing, or user-signing-material custody."
  - "Do not make DB/indexer/API/Redis authoritative for financial state."
  - "Do not weaken REC-01 through REC-06 or allow rebuild success without PASS authoritative reconciliation."
  - "Do not use metadata to resolve financial state or protocol authority."
  - "Do not allow unbounded DB queues, fanout queues, cache stampedes or search concurrency."
