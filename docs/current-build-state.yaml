  - "Lane 2 visual correction — Bread-specific brand mark: RED efd66d34fc83073b3da45fbef475a9192af69a44 -> GREEN 439ee0103b84d05aa5042942cc03ece9d50f1372."
  - "Lane 2 Search-shell correction: RED 303f704b650d1596cd84c18026de9f091c2fcfa5 -> accepted GREEN 990dd5e9358cf23655cdc9ada45de650632002ae; Ctrl+K/Cmd+K + 16px search glyph, accessible Search name preserved."
  - "Lane 2 mobile-shell correction: RED 577a8305106a63a5ae410e1080e4392f5310cdb9 proved the 390x844 live strip was hidden while 26 other browser journeys passed. Production GREEN 83220005d2ae93755ec380abf4566a6929feeeee restores 56px mobile top -> truthful 36px strip -> page, retains persistent bottom nav, and adds exact mobile screenshot evidence."
  - "APPROVED_VISUAL_REFERENCE_RECONCILIATION PASS at accepted evidence head 6c0cee1a27f8c0adcf8b57fd44ff22693db006e3. Evidence: docs/evidence/ui-v2-2-lane2-approved-visual-reference-reconciliation.md. Desktop 1586x992 artifact 9252919190; mobile 390x844 artifact 9252919323; exact-head root/browser/security/wallet/production/truthfulness regressions PASS."
  - "Lane 3 Explore feed authority accepted: New uses backend launch order; Trending accepted at 8a1698f538be8b399e23bbcf461c089e572bb8fb; canonical Baked-progress projection repaired at cef4090679faa2ea59859d816e01fff13fbb12df; Almost Baked accepted at 723204b4be0eeaf759a2ca5c1c7e255a2f132ee3; Graduated accepted at e7171022979621935c142ba4e860453341c5da07. All four v2.2 tabs have backend-backed membership/order authority; no frontend ranking/classification is accepted."
  - "Lane 3 Search interaction state accepted through keyboard result navigation, exact-contract labeling, compact contract identity, canonical creator attribution, focus containment/return, desktop shortcut and mobile full-height behavior. Search enrichment remains open where the indexed DTO does not project required market/holder/age/lifecycle/group/recent/trending data; missing values may not be fabricated."
  - "Lane 3 Age filter accepted cross-layer: backend exact head 3e4330c6b1ced9678f2e90a5690ebb8b27193bcf; final UI/browser exact head 57d1636522790f11f810b5164f36c27431940fc8. Presets are <5m, <1h, 1–24h and 1–7d against committed indexed-head time; invalid values fail closed; feed URL context/chips/Reset are preserved without client membership filtering."
  - "Lane 3 Holder filter accepted cross-layer at exact head 6fec3eb6f39eeecbf9bfd4a9202b7079c8e5a069. Inclusive indexed holder bounds apply across New/Trending/Almost Baked/Graduated; invalid/inverted values fail closed; Age/feed context and removable Holder + Age chips/Reset are preserved; no client-side holder filtering or raw-RPC fanout."
  - "Lane 3 Baked Progress filter accepted cross-layer at exact code-bearing head f11aad7c37704519cdf7fdbf9d2055f5df5d0fa9. The user-facing control is an inclusive 0–100% bonding-token range translated exactly to canonical graduation_progress_bps 0–10000; server-selected membership remains authoritative; view + Age + Holder context, removable chips and Reset are preserved; percentage is not used as lifecycle classification. Historical REDs, minimum GREEN, build-safe percent conversion, unique form identity and retained Age accessibility-selector regression were all resolved before one-head focused + adjacent + browser + 10k load + recovery + CI acceptance."
  - "Lane 3 Creator wallet filter accepted cross-layer at exact code-bearing head 842f17b5c84c08d441e25c5d215188b884856b1a. Canonical creator identity is launches.deployer_address / LaunchCreated.deployer, explicitly distinct from creator_fee_recipient. The PostgreSQL RED fixture deliberately made one non-matching deployer pay creator fees to the target wallet so a fee-recipient implementation could not pass. Backend filtering applies before pagination/ranking in New, Trending, Almost Baked and Graduated; malformed addresses fail closed; creator is included in feed cache identity. The UI forwards the creator wallet, preserves feed + Age + Holder + Baked context, exposes a removable compact Creator chip + Reset, renders server-selected membership only, and performs no client-side creator filtering or raw-RPC fanout."
  - "Lane 3 24h Volume filter accepted cross-layer at exact code-bearing head c5bd4caf9dcec0926eddf00934cf5c4441a9fd2b. The public UI accepts human USDC and forwards exact canonical 6-decimal quote base-unit bounds as volumeMinQuote/volumeMaxQuote; backend membership uses timestamped trades in the trailing 24h window anchored to the committed indexed-through timestamp. A PostgreSQL fixture deliberately poisoned token_metrics.quote_volume_24h and placed a large trade one second outside the window so stale/cumulative metric authority could not pass. New, Trending, Almost Baked and Graduated apply inclusive bounds before pagination/ranking truncation. The UI preserves Age + Holder + Baked + Creator + feed context, chips/Reset, and performs no client-side volume filtering or raw-RPC fanout. A first UI GREEN exposed an unreachable Creator submit control after the added filter increased drawer height; the drawer was repaired with bounded viewport scrolling before final exact-head acceptance."
  - "Lane 3 Search Age enrichment accepted cross-layer at exact code-bearing head d2565bdcedfe9feb5a7f5474163b27b7aa2f74ec. Search age is derived server-side as max(0, committed indexedThroughBlockTimestamp - launchTimestamp) and exposed as ageSeconds; browser wall clock is never used. Future/skewed launch timestamps clamp to zero. The UI renders quiet compact age metadata (for example 125 seconds -> Age 2m) and explicitly does not infer New/Active/Almost Baked/Processing/Graduated lifecycle from age. The real PostgreSQL RED and desktop/mobile browser RED both failed only on the missing age contract before minimum GREEN; final exact-head API/type/build/browser/cross-browser/10k/recovery/rollback/release-matrix evidence is green."

