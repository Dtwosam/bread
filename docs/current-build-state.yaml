decisions_since_last_state:
  - "Source Pack v1.3 remains controlling for the approved bundle: Bread-owned FeeEscrow adaptation, Bread-owned FeePolicy, Bread-owned atomic Launch+Buy, and Bread-owned descending buy-only anti-snipe protection."
  - "The Day-3 production design is frozen at docs/superpowers/specs/2026-08-08-day3-trading-fees-escrow-design.md from commit f88892a8f594ba2463d40ad52227b5c23b6f45fd."
  - "The Day-3 TDD/integration implementation plan is frozen at docs/superpowers/plans/2026-08-08-day3-trading-fees-escrow.md from commit f17976c6aae91ac69ce50af62ca7032df1899911."
  - "Day-3 design uses a concrete ERC20-USDC-only BreadBondingCurve extending BreadTrackedCurveState, a Bread-owned future-policy/snapshot contract, and a Bread-owned authorized-credit FeeEscrow with totalOutstanding solvency accounting."
  - "Frozen Pons Buy/Sell semantics retained for the ERC20 path include quote-leg fee/tax separation, source-derived partial final-buy clamp/reprice/refund, price-bound slippage for clamped buys, sell fee/tax from gross quote output, and closing sells once readyToGraduate. Native quote and automatic graduation remain excluded."
  - "Day-3 fee sweep is explicitly no-buyback: pending base fee is split by the snapshotted protocol share; creator receives the base-fee remainder plus creator tax; exact USDC is credited to FeeEscrow. Buyback state/execution remains separately gated."
  - "FeePolicy current values are explicit deployment/test inputs with no guessed defaults. Existing curves snapshot economics; feeSweepOperator remains a rotatable operational role and does not rewrite launch economics."
  - "FeeEscrow credit callers are owner-authorized Bread components; credit verifies exact USDC custody before increasing recipient ledger/totalOutstanding; claim debits state before transfer and has no alternate-recipient or admin claim-rescue surface."
  - "Required TDD order is FeeEscrow RED/GREEN -> FeePolicy RED/GREEN -> ordinary trading RED/GREEN -> partial-final-buy RED/GREEN -> fee-sweep/claim RED/GREEN -> stateful invariants -> integrated exact-head CI."
  - "No Day-3 production money-path code has been written yet. The next code change must be a production-facing test that captures Task-1 RED."
