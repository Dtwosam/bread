  - "Day-3 external-component matrix is durable at docs/source-reconciliation/day3-external-component-research-matrix.md from commit 61402df113304bbb2782bec9ba3bb6d086376fb1."
  - "Architecture approval granted for the recommended bundle: Bread-owned FeeEscrow adaptation, Bread-owned FeePolicy, Bread-owned atomic Launch+Buy, and Bread-owned descending buy-only anti-snipe protection."
  - "Source Pack v1.3 freezes those decisions at docs/source-reconciliation/bread-source-pack-v1.3.md from commit 6505532e1c66bf666a19f6fa23c06ae890c3c1b6. Verdict: SOURCE_PACK_V1_3_POST_RESEARCH_ARCHITECTURE_FREEZE_APPROVED."
  - "FeeEscrow is now authorized architecturally as a Bread-owned canonical-USDC-only ledger adapted from the minimal ClankerFeeLocker pattern: Bread credit authority, recipient ledger, totalOutstanding solvency accounting, state-before-transfer claims, deterministic events, donation-resistant entitlement, and no admin withdrawal of claim backing."
  - "FeePolicy remains entirely Bread-owned. It must preserve per-launch snapshots, creator-tax separation, exact fee rounding/reconciliation and canonical FeeEscrow handoff. LIVE_RUNTIME_CONFIG is still unresolved, so missing live percentages are not guessed or hardcoded."
  - "Launch+Buy architecture is Bread-owned and atomic. It must preserve canonical 6-decimal USDC, user slippage bounds, partial final-buy clamp/refund, no stranded temporary custody and full rollback. FlaunchZap and Clanker dev-buy remain references only. Production implementation remains Day 4 under 06C."
  - "Anti-snipe architecture is Bread-owned, descending and buy-only. Existing 07A evidence remains the behavior envelope: approximately 99% opening tax, exponential decay to zero over 5 seconds, with explicit launcher/creator-fee-recipient/fixed launch-time exemptions where verified. ClankerMevDescendingFees is technical reference only; no Clanker economics or parabolic formula are inherited."
  - "Exact Pons snipe formula parity is no longer an architecture prerequisite. A narrower BREAD_SNIPE_DECAY_FORMULA gate remains: freeze one deterministic Bread fixed-point formula satisfying the approved behavior envelope before Day-4 production implementation, then prove monotonicity, terminal zero, bounds, rounding and exemption correctness."
  - "FEE_ESCROW_SOURCE is resolved by explicit approved reimplementation/adaptation; LAUNCH_AND_BUY_SOURCE is resolved by Bread-owned reconstruction; EXACT_SNIPE_IMPLEMENTATION is superseded by the approved Bread-owned architecture. CURRENT_PONS_FACTORY_SOURCE_PARITY, LIVE_RUNTIME_CONFIG, PONS_AUDIT_FINDINGS and ARC_MAINNET_VALUES remain active."
  - "No Day-3 production money-path code was introduced during research or Source Pack v1.3 promotion. Buyback/vesting remains separately gated and is not implicitly authorized by FeeEscrow approval."
