project_process_note:
  task8_actions_budget_blocker: >-
    During Task 8, GitHub Actions repeatedly created zero-step jobs while account Actions spend capacity was unavailable. No zero-step execution was counted as repository failure or PASS and no workflow gate was weakened. After the account Actions budget was increased, exact-head runner execution resumed and required gates passed.
  task9_scope_rule: >-
    Task 9 closes the source-defined first meaningful Day-6 read/replay/cache/fanout concurrency proof. It does not claim the later Day-8 10,000-client production-like stress target.
  task10_scope_rule: >-
    Task 10 closes deterministic selected-stack delete/rebuild and authoritative REC-01 through REC-06 reconciliation. Rebuild uses the same production applyRange path, requires isolated/local target verification before destructive work, requires PASS authoritative reconciliation before success, and does not create a second financial authority.
  task11_scope_rule: >-
    Task 11 is validation/evidence/CI/durable closeout only. It does not redesign Day 6, add financial authority, invent production values, or authorize Day 7 before the post-closeout handoff from actual merged main is itself exact-head green and merged.
  day7_task1_scope_rule: >-
    Task 1 freezes and integrates the 04B design tokens, reusable UI primitives and responsive global shell only. It does not fabricate feed/token data, implement Search/wallet/transaction behavior early, add raw-RPC primary reads, invent routes or change protocol/economic semantics.
  day7_task2_scope_rule: >-
    Task 2 establishes the canonical browser consumer boundary for the accepted Day-6 indexed read API: response/freshness propagation, typed errors, bounded query serialization, shared query deduplication and truthful degraded-state presentation. It adds no page-level feed/search product behavior, raw-RPC fallback, server-side write authority or financial semantics.
  day7_task3_scope_rule: >-
    Task 3 integrates the frozen Explore/Search discovery surfaces only. It consumes the Task-2 indexed read/query boundary, extends canonical shared API DTOs additively, exposes already-indexed graduation progress through the existing batched feed metric load, keeps unsupported deterministic ranking views explicitly not-ready, and introduces no raw-RPC primary UX, transaction authority, guessed finance, production value or second API/domain authority.
  day7_task4_scope_rule: >-
    Task 4 integrates the frozen Token read experience only. It extends canonical shared API DTOs and the existing token-detail projection additively, consumes indexed token/trade/holder boundaries, exposes accepted graduation evidence, keeps unsupported chart/financial values explicit, and leaves wallet simulation/signing/submission/recovery disabled for Task 5. It adds no raw-RPC primary read, server transaction authority, guessed economics or production/mainnet values.
  day7_task5_scope_rule: >-
    Task 5 integrates direct wallet/provider Buy/Sell preparation and execution, canonical pre-sign chain reread/simulation, exact allowance handling, final-review protection, persisted transaction lifecycle/reload/replacement recovery and the accepted responsive Token trade surfaces. It adds no API write authority, server signing/relaying/custody, independent financial formula or ledger authority, Solidity behavior, guessed production economics or mainnet values.
  day7_task5_allowance_repair_scope_rule: >-
    The post-Task-5 continuity repair corrects approval-before-simulation ordering, persists and recovers unresolved approval hashes, serializes unresolved approval lanes, and keeps UNKNOWN transactions duplicate-action locked. The record is recovery metadata only; chain allowance remains authoritative. No Solidity, protocol economics, API write authority, server transaction authority, package dependency, production value or mainnet value changes.
  day7_task6_scope_rule: >-
    Task 6 integrates the frozen /create form, in-route Review, canonical chain-derived launch/economics preparation, Launch and atomic Launch & Buy, direct wallet execution, shared transaction persistence/recovery and confirmed LaunchCreated token identity. It reuses accepted Task-5 wallet/allowance/state owners and Day-6 SDK/config authority, keeps unsupported buyback unavailable, and fails closed while canonical Arc-testnet protocol deployment identity is unresolved. It adds no API write authority, server transaction authority, second financial/state/ABI authority, guessed economics, mainnet values or DEX activation.
  day7_task7_scope_rule: >-
    Task 7 integrates wallet-aware Portfolio and Creator projections plus direct-wallet USDC claims. Portfolio/Creator normal reads remain indexed/API-backed; Claim amount authority is a fresh canonical FeeEscrow balance reread before simulation/signature. PnL/average entry and unsupported Creator analytics remain unavailable rather than guessed. Claim execution/recovery extends the shared transaction owner with action- and recipient-scoped records, preserves BUY/SELL default recovery ownership, persists hashes before confirmation wait, distinguishes revert/replacement/UNKNOWN transport state, and invalidates Creator projection after confirmation. No API mutation authority, second claim ledger, per-row RPC fanout, guessed finance, production value or mainnet value is introduced.

