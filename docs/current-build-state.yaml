decisions_since_last_state:
  - "Day-2 closeout PR #7 head 06385e4a561ece563cefe0580317b13309ff035a passed all four CI jobs in run 31256962864 and merged at 5d13689f1ebc54f609c0fcf61ea43287b207e61a. Day-2 verdict is DAY_2_FINANCIAL_CORE_MATH_TOKEN_INTEGRATED_PASS."
  - "Day-3 controlling work is Buy/Sell with slippage and partial final buy/refund, FeePolicy snapshot and creator-tax separation, FeeEscrow pull claims, buyback/vesting only after reconciliation, and stateful USDC/fee/escrow invariants."
  - "05C applicable Day-3 invariants include INV-001 through INV-006, INV-010 through INV-012 where affected, INV-020 through INV-026, and INV-030 through INV-035 when corresponding fee/buyback functionality exists."
  - "03 explicitly permits FeeEscrow to be reimplemented if needed, but treats it as new security-sensitive financial code requiring explicit unit, fuzz, invariant, integration and independent review. Its minimum invariants include own-ledger-only claims, state update before external control, failed-transfer claim preservation, no admin withdrawal of recipient claims, USDC balance/outstanding-claims reconciliation and deterministic credit/claim events."
  - "The public pons GitHub repository still has no commit newer than frozen d5491e20be56051a68abf47136f6890c3ce3ff7d and no concrete PonsV2FeeEscrow source was found in the public snapshot."
  - "Current accessible pons docs describe a materially different Robinhood Chain / direct Uniswap V3 stack with no bonding curve or migration. Bread will not substitute those new semantics for the frozen old Pons V2 baseline. CURRENT_PONS_FACTORY_SOURCE_PARITY and LIVE_RUNTIME_CONFIG remain unresolved."
  - "Frozen old Pons V2 Buy/Sell mechanics are source-visible, including tracked reserves, quote-leg fee/tax, partial final-buy clamp/refund and price-bound slippage; frozen fee/buyback sweep logic is coupled to FeePolicy, FeeEscrow and BuybackVault and must not be copied before those dependencies are explicitly reconciled."
  - "Frozen PonsV2BuybackVault source is available and implements five-year weighted-average vesting, beneficiary/split snapshots, balance-delta locking and escrow-routed releases, but it remains a separate Day-3 reconciliation decision rather than automatically authorized production code."
  - "External component sourcing is now allowed only through docs/source-reconciliation/component-sourcing-reuse-gate.md at commit de50a7e635a58891efe42f7db40d231acde7846f. Candidates must have exact provenance/license/assumption review and a REUSE, ADAPT, REFERENCE_ONLY or REJECT verdict before implementation."
  - "Sourced components do not become standalone Bread entities. Every sourced-component lane starts from the current integrated baseline, defines upstream/downstream/invariant impact, wires every already-existing applicable consumer as soon as its interface is stable, runs affected regressions, and advances the single Bread integration baseline before PASS."
  - "LOCAL_COMPONENT_PASS != BREAD_PASS. FeeEscrow specifically cannot PASS on contract tests alone; its trade-fee handoff and every currently existing applicable canonical consumer path must agree, while future SDK/indexer/API/dashboard lanes must consume the frozen escrow interface rather than redefine accounting."
next_action: "Research and produce the Day-3 external-component candidate matrix, starting with FeeEscrow and FeePolicy/fee splitting, then record suitable later candidates for Launch+Buy and snipe protection. For every candidate verify exact repository/commit/path, license, audits/history where available, dependencies, asset/decimal/accounting assumptions, privileges, failure semantics and compatibility with Bread. Classify each as REUSE, ADAPT, REFERENCE_ONLY or REJECT. Do not write production code until the selected Day-3 component architecture is approved and its continuous integration impact map is frozen."
