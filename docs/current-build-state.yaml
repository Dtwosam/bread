project_process_note:
  day7_task10_scope_rule: >-
    Task 10 closed the primary browser-journey and integrated Day-7 web lane only. It proved the frozen browse/search/token/trade/create/portfolio/creator/wallet/degraded/recovery/mobile flows using deterministic Playwright fixtures that preserve existing API, SDK, wallet, transaction and canonical-config authorities. It repaired only demonstrated presentation/recovery gaps and added no financial or mainnet authority.
  task10_recovery_rule: >-
    The existing canonical submitted-transaction storage and receipt recovery remain authoritative. Task 10 only makes recovered BUY/SELL state visible through the existing web runtime so refresh cannot present a fresh submit-able trade while recovery is unresolved; it does not duplicate polling, persistence or wallet-send logic.
  day8_scope_rule: >-
    Day 8 attacks the integrated system through extended fuzz/invariants, static/manual security review, RPC/API/indexer/realtime failure injection, hot-launch/bot-burst capacity tests, malicious metadata/CSP/sanitization checks, privileged-role abuse attempts and recovery/runbook verification. It is not a feature-development lane and does not waive open release/mainnet blockers.
  capacity_measurement_rule: >-
    06I keeps separate obligations: the 10,000-concurrent hot-launch stress gate proves convergence, healthy-read errors below one percent, bounded shared-service work and no viewer-linear RPC multiplication; existing 04D token/feed p95 targets remain under representative load. The Day-8 harness preserves both rather than weakening either threshold.

