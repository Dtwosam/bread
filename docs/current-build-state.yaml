  Run the exact-head six-workflow gate on Task-9 durable handoff PR #54: inherited CI, retained Task-5, retained Task-6, retained Task-7, retained Task-8 and dedicated Task-9 API/search/concurrency proof. Require real runner steps and full PASS. Then guarded-merge PR #54 with expected-head protection, verify merged main, and only then start Day-6 Task 10 from the new durable main baseline, RED-first, limited to delete-DB rebuild, authoritative reconciliation and final Day-6 correctness/closeout gates.

do_not_do:
  - "Do not start Day-6 Task 10 before Task-9 durable handoff PR #54 is exact-head green and guarded-merged."
  - "Do not route user trades through a centralized Bread trade server."
  - "Do not add server-side transaction submission, signing, relaying, queueing, or key custody."
  - "Do not make DB/indexer/API/Redis authoritative for financial state."
  - "Do not fabricate PnL, average entry, graduated DEX price/value, holder concentration or search ranking semantics without source authority."
  - "Do not use metadata to resolve financial state or protocol authority."
  - "Do not allow unbounded DB queues, fanout queues, cache stampedes or search concurrency."
  - "Do not silently rewrite a committed checkpoint when provider block hash contradicts it."
  - "Do not infer or guess production economics/authority values, Arc mainnet values, or canonical Arc DEX addresses."
