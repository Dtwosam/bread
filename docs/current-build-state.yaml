day6_handoff_contract:
  scope: "Protocol SDK + canonical ABI/address/manifest/type layer + transactional indexer/checkpoints/replay + projections/candles/metrics + read API + DB rebuild/reconciliation + initial concurrency/cache/fanout proof"
  authority: "Chain is authoritative; PostgreSQL/indexer/Redis/API are deterministic rebuildable read projections with no financial write authority"
  approved_architecture: TRANSACTIONAL_EVENT_JOURNAL_WITH_SYNCHRONOUS_PROJECTIONS
  journal_identity: "canonical event identity derives from chain/log identity; trade identity is chainId + transactionHash + logIndex per 06B"
  transaction_rule: "journal insert + affected projection updates + finalized checkpoint advancement occur in one PostgreSQL transaction"
  post_commit_rule: "cache invalidation and realtime fanout happen only after durable DB apply"
  replay_rule: "overlap replay is idempotent and cannot duplicate canonical event/projection outcomes"
  realtime_rule: "realtime is convenience only; logical-channel fanout; clients deduplicate and refetch after disconnect"
  acceptance:
    - DELETE_DB_REBUILD_PASS
    - OVERLAP_REPLAY_IDEMPOTENT
    - API_FRESHNESS_METADATA_PRESENT
    - RECONCILE_PASS
    - FIRST_MEANINGFUL_CONCURRENT_READ_REPLAY_CACHE_FANOUT_TESTS_PASS
  source_defined_api:
    - GET /v1/feed
    - GET /v1/search
    - GET /v1/tokens/:address
    - GET /v1/tokens/:address/trades
    - GET /v1/tokens/:address/holders
    - GET /v1/portfolio/:address
    - GET /v1/creators/:address
    - GET /v1/status
  source_defined_tables:
    - protocol_stacks
