project_process_note:
  day8_scope_rule: >-
    Day 8 attacks the integrated system through extended fuzz/invariants, static/manual security review, RPC/API/indexer/realtime failure injection, hot-launch/bot-burst capacity tests, malicious metadata/CSP/signing-target checks, privileged-role abuse attempts and recovery verification. It is not a feature-development lane and does not waive open release/mainnet blockers.
  capacity_measurement_rule: >-
    06I keeps separate obligations: the 10,000-concurrent hot-launch stress gate proves convergence, healthy cached/read errors below one percent, bounded shared-service work and no viewer-linear RPC multiplication; existing 04D token/feed p95 targets remain under representative load. The Day-8 harness preserves both rather than weakening either threshold.
  resilience_ownership_rule: >-
    Day-8 RPC failover and indexer catch-up wrap the existing LogClient/replayOverlap boundaries. Runtime callers retain provider/network selection, retryability policy, observed-head authority, durable checkpoint reads and event application. No parallel chain, accounting or deployment authority is introduced.

