project_process_note:
  task8_actions_budget_blocker: >-
    During Task 8, GitHub Actions repeatedly created zero-step jobs while account Actions spend capacity was unavailable. No zero-step execution was counted as repository failure or PASS and no workflow gate was weakened. After the account Actions budget was increased, exact-head runner execution resumed and required gates passed.
  task9_scope_rule: >-
    Task 9 closes the source-defined first meaningful Day-6 read/replay/cache/fanout concurrency proof. It does not claim the later Day-8 10,000-client production-like stress target.
  task10_scope_rule: >-
    Task 10 closes deterministic selected-stack delete/rebuild and authoritative REC-01 through REC-06 reconciliation. Rebuild uses the same production applyRange path, requires isolated/local target verification before destructive work, requires PASS authoritative reconciliation before success, and does not create a second financial authority.
  task11_scope_rule: >-
    Task 11 is validation/evidence/CI/durable closeout only. It does not redesign Day 6, add financial authority, invent production values, or authorize Day 7 before the post-closeout handoff from actual merged main is itself exact-head green and merged.
  day7_task1_scope_rule: >-
    Task 1 freezes and integrates the 04B design tokens, reusable UI primitives and responsive global shell only. It does not fabricate feed/token data, implement Search/wallet/transaction behavior early, add raw-RPC primary reads, invent routes or change protocol/economic semantics.
  day7_task2_scope_rule: >-
    Task 2 establishes the canonical browser consumer boundary for the accepted Day-6 indexed read API: response/freshness propagation, typed errors, bounded query serialization, shared query deduplication and truthful degraded-state presentation. It adds no page-level feed/search product behavior, raw-RPC fallback, server-side write authority or financial semantics.

