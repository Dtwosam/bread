project_process_note:
  day8_scope_rule: >-
    Day 8 is stabilization/security/failure-injection/capacity work. It introduced no new product economics, custody model, user transaction relay, wallet/transaction/recovery owner, financial ledger or mainnet authority.
  capacity_measurement_rule: >-
    06I keeps separate obligations: the 10,000-concurrent hot-launch stress gate proves convergence, healthy-read errors below one percent, bounded shared-service work and no viewer-linear RPC multiplication; existing 04D token/feed p95 targets remain under representative load. The accepted Day-8 harness preserves both rather than weakening either threshold.
  rpc_failover_rule: >-
    The Day-8 failover primitive owns bounded per-provider concurrency, queueing, circuit state and failover mechanics only. Provider identity, network authority, requested logs and retry policy inputs remain caller-owned; no production RPC value is invented.
  indexer_catchup_rule: >-
    The Day-8 catch-up controller reuses the existing replay/apply boundary and owns only bounded cycle/batch orchestration plus regression/no-progress guards. Head observation, committed checkpoint read and application authority remain with existing callers.
  cache_authority_rule: >-
    Successful public feed/token projections may advertise the source-approved one-second shared-cache policy; operational status and error paths remain no-store. Cache/API/indexer state remains non-authoritative for financial truth.

